name: AUXGS interface donor x86_64

on:
  push:
    branches: [auxgs-interface-fix-r6]
    paths:
      - ".github/workflows/auxgs-interface-donor.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact onRps4 runtime base
        uses: actions/checkout@v4
        with:
          repository: dev-Ali2008/onRps4-runtime
          ref: 5b50e35c38ad09088761c1b146168107dcdec1e7
          fetch-depth: 0
          submodules: false
          path: source

      - name: Hydrate nested shadPS4 submodules
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git config --global --add safe.directory "*"
          hydrate_repo() {
            local root="$1"
            local depth="$2"
            (( depth > 5 )) && return 0
            [[ -f "$root/.gitmodules" ]] || return 0
            while read -r key path; do
              local name="${key#submodule.}"
              name="${name%.path}"
              local url branch target
              url="$(git -C "$root" config -f .gitmodules --get "submodule.$name.url" || true)"
              branch="$(git -C "$root" config -f .gitmodules --get "submodule.$name.branch" || true)"
              target="$root/$path"
              [[ -n "$url" ]] || continue
              git -C "$root" -c submodule.recurse=false submodule sync -- "$path" || true
              if ! git -C "$root" -c submodule.recurse=false submodule update --init --depth 1 -- "$path"; then
                rm -rf "$target"
                if [[ -n "$branch" ]]; then
                  git clone --depth 1 --branch "$branch" "$url" "$target" || git clone --depth 1 "$url" "$target"
                else
                  git clone --depth 1 "$url" "$target"
                fi
              fi
              [[ -d "$target" ]] && hydrate_repo "$target" "$((depth + 1))" || true
            done < <(git -C "$root" config -f .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null || true)
          }
          hydrate_repo "runtime/sources/shadps4" 0

      - name: Pin SDL3 before XIM rewrite
        shell: bash
        working-directory: source/runtime/sources/shadps4/externals/sdl3
        run: |
          set -euo pipefail
          git fetch --depth 1 origin 1f3b40797d9cbd03fe50342069e3449a779723dc
          git checkout --detach 1f3b40797d9cbd03fe50342069e3449a779723dc

      - name: Apply external ImGui compatibility shim
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          FILE="runtime/sources/shadps4/externals/ImGuiFileDialog/ImGuiFileDialog.cpp"
          grep -q 'NextWindowData.ChildFlagsSet' "$FILE"
          sed -i 's/NextWindowData\.ChildFlagsSet/NextWindowData.ChildFlags/g' "$FILE"

      - name: Fetch and apply original AUX-GS
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/shadps4-emu/shadPS4/commit/7db6e4ba56b98841624ab776aaa56763f10bdc89.patch \
            -o "$GITHUB_WORKSPACE/auxgs.patch"
          git apply --reject --whitespace=nowarn \
            --directory=runtime/sources/shadps4 \
            "$GITHUB_WORKSPACE/auxgs.patch"

      - name: Apply interface correction
        shell: bash
        working-directory: source
        env:
          FIX_Z: ""
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, base64, zlib
          open('/tmp/interface.patch','wb').write(zlib.decompress(base64.b64decode(os.environ['FIX_Z'])))
          PY
          git apply --check --directory=runtime/sources/shadps4 /tmp/interface.patch
          git apply --directory=runtime/sources/shadps4 /tmp/interface.patch
          grep -n "one flat array<T,3>" runtime/sources/shadps4/src/shader_recompiler/backend/spirv/emit_spirv_per_vertex.cpp
          git diff --stat

      - name: Install and build x86-64 shadPS4
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE/source:/workspace" \
            -w /workspace \
            -e BACHATA_INSIDE_DEBIAN_CONTAINER=1 \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates curl
              git config --global --add safe.directory "*"
              bash runtime/scripts/install-debian-runtime-deps.sh
              bash runtime/scripts/build-shadps4-x86_64.sh
            '

      - name: Collect x86-64 donor
        shell: bash
        run: |
          set -euo pipefail
          CORE="$(find source/runtime/build -type f -name shadps4 -size +10M | head -n1)"
          test -n "$CORE"
          file "$CORE"
          readelf -h "$CORE" | grep -E 'ELF64|X86-64|Advanced Micro Devices X86-64'
          cp "$CORE" "$GITHUB_WORKSPACE/shadps4-order-auxgs-interface-x86_64"
          sha256sum "$GITHUB_WORKSPACE/shadps4-order-auxgs-interface-x86_64" | tee "$GITHUB_WORKSPACE/shadps4-order-auxgs-interface-x86_64.sha256"
          nm -C -S "$GITHUB_WORKSPACE/shadps4-order-auxgs-interface-x86_64" | grep 'EmitPerVertexAuxGS' | tee "$GITHUB_WORKSPACE/emit-symbol.txt"

      - name: Upload donor core
        uses: actions/upload-artifact@v4
        with:
          name: ORDER1886-AUXGS-INTERFACE-X86_64
          path: |
            shadps4-order-auxgs-interface-x86_64
            shadps4-order-auxgs-interface-x86_64.sha256
            emit-symbol.txt
          if-no-files-found: error
          retention-days: 7
