name: AUXGS interface donor x86_64

on:
  push:
    branches: [auxgs-interface-fix-r6]
    paths:
      - ".github/workflows/auxgs-interface-donor.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    timeout-minutes: 300
    steps:
      - name: Bootstrap
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git nodejs ca-certificates python3

      - name: Checkout exact onRps4 runtime
        run: |
          git clone https://github.com/dev-Ali2008/onRps4-runtime.git source
          cd source
          git checkout 5b50e35c38ad09088761c1b146168107dcdec1e7
          git rev-parse HEAD

      - name: Install build dependencies and externals
        working-directory: source
        run: |
          bash runtime/scripts/install-debian-runtime-deps.sh
          find runtime/sources/shadps4/externals -maxdepth 1 -type d -empty -delete || true
          rm -rf runtime/sources/shadps4/externals/zlib-ng
          python3 runtime/scripts/populate-shadps4-submodules.py runtime/sources/shadps4
          git -C runtime/sources/shadps4/externals/sdl3 fetch --depth 1 origin 1f3b40797d9cbd03fe50342069e3449a779723dc
          git -C runtime/sources/shadps4/externals/sdl3 checkout 1f3b40797d9cbd03fe50342069e3449a779723dc
          rm -rf externals
          ln -s runtime/sources/shadps4/externals externals

      - name: Materialize AUXGS patches
        env:
          AUX_Z: ""
          FIX_Z: ""
        run: |
          python3 - <<'PY'
          import os, base64, zlib
          open('/tmp/auxgs.patch','wb').write(zlib.decompress(base64.b64decode(os.environ['AUX_Z'])))
          open('/tmp/interface.patch','wb').write(zlib.decompress(base64.b64decode(os.environ['FIX_Z'])))
          PY
          wc -c /tmp/auxgs.patch /tmp/interface.patch

      - name: Apply AUXGS and interface fix
        working-directory: source
        run: |
          git apply --check /tmp/auxgs.patch
          git apply /tmp/auxgs.patch
          git -C runtime/sources/shadps4 apply --check /tmp/interface.patch
          git -C runtime/sources/shadps4 apply /tmp/interface.patch
          grep -n "one flat array<T,3>" runtime/sources/shadps4/src/shader_recompiler/backend/spirv/emit_spirv_per_vertex.cpp
          git diff --stat
          git -C runtime/sources/shadps4 diff --stat

      - name: Build exact x86_64 donor
        working-directory: source
        env:
          FAST_FDROID_BUILD: "0"
        run: |
          bash runtime/scripts/build-shadps4-x86_64.sh
          cp runtime/build/shadps4-stage/bin/shadps4 "$GITHUB_WORKSPACE/shadps4-order-auxgs-interface-x86_64"
          file "$GITHUB_WORKSPACE/shadps4-order-auxgs-interface-x86_64"
          readelf -h "$GITHUB_WORKSPACE/shadps4-order-auxgs-interface-x86_64" | grep -E "ELF64|X86-64"
          sha256sum "$GITHUB_WORKSPACE/shadps4-order-auxgs-interface-x86_64" | tee "$GITHUB_WORKSPACE/shadps4-order-auxgs-interface-x86_64.sha256"

      - name: Upload donor core
        uses: actions/upload-artifact@v4
        with:
          name: ORDER1886-AUXGS-INTERFACE-X86_64
          path: |
            shadps4-order-auxgs-interface-x86_64
            shadps4-order-auxgs-interface-x86_64.sha256
          if-no-files-found: error
          retention-days: 7
