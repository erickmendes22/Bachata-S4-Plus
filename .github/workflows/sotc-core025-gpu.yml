name: SOTC GPU LOD ARM64 Experimental

on:
  push:
    branches: [feature/sotc-core025-gpu-compat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sotc:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout SOTC patch control files
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout real shadPS4 ARM64 source
        uses: actions/checkout@v4
        with:
          repository: zenithblue-oss/shadps4-arm64
          ref: be6bc2e9c60799e071dd2fafa6216e8d80ec619c
          fetch-depth: 0
          submodules: false
          path: source

      - name: Self-heal and hydrate submodules
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail

          hydrate_repo() {
            local root="$1"
            local depth="$2"
            (( depth > 5 )) && return 0
            [[ -f "$root/.gitmodules" ]] || return 0

            while read -r key path; do
              local name="${key#submodule.}"
              name="${name%.path}"
              local url branch target

              url="$(git -C "$root" config -f .gitmodules --get "submodule.$name.url" || true)"
              branch="$(git -C "$root" config -f .gitmodules --get "submodule.$name.branch" || true)"
              target="$root/$path"
              [[ -n "$url" ]] || continue

              git -C "$root" -c submodule.recurse=false submodule sync -- "$path" || true

              if ! git -C "$root" -c submodule.recurse=false                     submodule update --init --depth 1 -- "$path"; then
                rm -rf "$target"
                if [[ -n "$branch" ]]; then
                  git clone --depth 1 --branch "$branch" "$url" "$target" ||                   git clone --depth 1 "$url" "$target"
                else
                  git clone --depth 1 "$url" "$target"
                fi
              fi

              [[ -d "$target" ]] && hydrate_repo "$target" "$((depth + 1))" || true
            done < <(
              git -C "$root" config -f .gitmodules                 --get-regexp '^submodule\..*\.path$' 2>/dev/null || true
            )
          }

          hydrate_repo "." 0

      - name: Apply SOTC PM4 LOD graphics port
        shell: bash
        working-directory: source
        run: |
          python3 ../control/tools/sotc-core025/port_sotc_lod.py .
          # Never silently replace the user's existing stripped R30 core.
          test "$(git rev-parse HEAD)" = be6bc2e9c60799e071dd2fafa6216e8d80ec619c
          git diff --stat

      - name: Compile experimental SOTC AArch64/FEX binary
        shell: bash
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE/source:/workspace"             -w /workspace             -e BACHATA_INSIDE_DEBIAN_CONTAINER=1             debian:trixie             bash -lc '
              set -euo pipefail

              # The GitHub runner owns the bind-mounted repositories, while the
              # Debian container builds as root. Git otherwise rejects nested
              # repos such as externals/ffmpeg-core as "dubious ownership".
              git config --global --add safe.directory "*"

              bash runtime/scripts/install-debian-runtime-deps.sh
              bash runtime/scripts/build-shadps4-arm64.sh
            '

      - name: Locate and verify compiled FEX core
        shell: bash
        run: |
          set -euo pipefail
          cd source
          CORE="$(find runtime/build -type f             \( -name 'shadps4-arm64-fex' -o -name 'shadps4-arm64' -o -name 'shadps4' \)             -size +10M | head -n1)"
          test -n "$CORE"
          test -s "$CORE"
          file "$CORE"
          readelf -h "$CORE" | grep -E 'ELF64|AArch64'
          cp "$CORE" "$GITHUB_WORKSPACE/shadps4-arm64-fex"
          sha256sum "$GITHUB_WORKSPACE/shadps4-arm64-fex"             | tee "$GITHUB_WORKSPACE/SOTC-shadps4-arm64-fex.sha256"

      - name: Upload experimental core (NOT drop-in replacement)
        uses: actions/upload-artifact@v7
        with:
          name: SOTC-PM4-LOD-ARM64-EXPERIMENTAL
          path: |
            shadps4-arm64-fex
            SOTC-shadps4-arm64-fex.sha256
          if-no-files-found: error
          retention-days: 7
