name: ImportService dump temp

on:
  push:
    paths:
      - '.github/workflows/importservice-dump-temp.yml'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK and JADX
        run: |
          set -eux
          curl -L -o plus.apk 'https://github.com/erickmendes22/Bachata-S4-Plus/releases/download/0.2.3/Bachata-S4-Plus-v0.2.3.apk'
          curl -L -o jadx.zip 'https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip'
          unzip -q jadx.zip -d jadx
      - name: Decompile storage classes
        run: |
          set -eux
          mkdir -p plus_src out
          ./jadx/bin/jadx --show-bad-code --no-res -d plus_src plus.apk || true
          find plus_src/sources/com/bachatas4/android -type f \( -iname '*ContentImporter*' -o -iname '*ContentImportResult*' -o -iname '*ContentImportRequest*' -o -iname '*GameRepository*' -o -iname '*GameDao*' -o -iname '*GameEntity*' -o -iname '*GameDatabase*' -o -iname '*AppDatabase*' \) -exec cp --parents {} out/ \; || true
          grep -RIl --include='*.java' -E 'storageMode|sourceUri.*DIRECT|GameStorageMode.DIRECT|addImportedGame' plus_src/sources/com/bachatas4/android | head -80 | while read f; do cp --parents "$f" out/; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: storage-jadx-dump
          path: out
