name: External PKG minimal build temp

on:
  push:
    paths:
      - '.github/workflows/importservice-dump-temp.yml'
      - '.github/tmp_externalpkg/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download base and tools
        run: |
          set -eux
          curl -L -o base.apk 'https://github.com/erickmendes22/Bachata-S4-Plus/releases/download/0.2.3/Bachata-S4-Plus-v0.2.3.apk'
          curl -L -o baksmali.jar 'https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar'
          curl -L -o smali.jar 'https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat-release.jar'
          curl -L -o kotlin-stdlib.jar 'https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.1.20/kotlin-stdlib-2.1.20.jar'
          curl -L -o coroutines.jar 'https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.10.2/kotlinx-coroutines-core-jvm-1.10.2.jar'
      - name: Patch classes2 only
        run: |
          set -eux
          unzip -p base.apk classes2.dex > classes2.dex
          java -jar baksmali.jar d classes2.dex -o smali2
          python3 - <<'PY'
          from pathlib import Path
          p=Path('smali2/com/bachatas4/android/service/ImportService.smali')
          s=p.read_text()
          old1='invoke-virtual/range {v48 .. v53}, Lcom/bachatas4/android/data/ContentImporter;->finalizeStagingTree(Lcom/bachatas4/android/data/ContentImportRequest;Ljava/io/File;Ljava/lang/String;Ljava/lang/String;Lkotlin/coroutines/Continuation;)Ljava/lang/Object;'
          new1='invoke-static/range {v48 .. v53}, Lcom/bachatas4/android/service/ExternalPkgBridge;->finalizeStagingTree(Lcom/bachatas4/android/data/ContentImporter;Lcom/bachatas4/android/data/ContentImportRequest;Ljava/io/File;Ljava/lang/String;Ljava/lang/String;Lkotlin/coroutines/Continuation;)Ljava/lang/Object;'
          old2='Lcom/bachatas4/android/data/GameRepository;->addImportedGame(Lcom/bachatas4/android/data/ContentImportResult;Ljava/lang/String;JLkotlin/coroutines/Continuation;)Ljava/lang/Object;'
          new2='Lcom/bachatas4/android/service/ExternalPkgBridge;->addImportedGame(Lcom/bachatas4/android/data/GameRepository;Lcom/bachatas4/android/data/ContentImportResult;Ljava/lang/String;JLkotlin/coroutines/Continuation;)Ljava/lang/Object;'
          c1=s.count(old1); c2=s.count(old2)
          assert c1 == 1, c1
          assert c2 >= 2, c2
          s=s.replace(old1,new1).replace('invoke-virtual/range {v4 .. v9}, '+old2, 'invoke-static/range {v4 .. v9}, '+new2).replace('invoke-virtual/range {v3 .. v8}, '+old2, 'invoke-static/range {v3 .. v8}, '+new2)
          assert old1 not in s
          p.write_text(s)
          print('patched finalize=',c1,'addImported refs=',c2)
          PY
          java -jar smali.jar a smali2 -o classes2-patched.dex
      - name: Compile bridge dex
        run: |
          set -eux
          mkdir -p stubsrc/com/bachatas4/android/data stubsrc/com/bachatas4/android/model build
          cat > stubsrc/com/bachatas4/android/data/ContentImporter.java <<'EOF'
          package com.bachatas4.android.data; import java.io.File; import kotlin.coroutines.Continuation;
          public class ContentImporter { public Object finalizeStagingTree(ContentImportRequest r, File f, String m, String c, Continuation<? super ContentImportResult> x){return null;} }
          EOF
          cat > stubsrc/com/bachatas4/android/data/ContentImportRequest.java <<'EOF'
          package com.bachatas4.android.data; public class ContentImportRequest { public String getId(){return null;} public String getTitle(){return null;} public String getSubtitle(){return null;} public String getDetail(){return null;} }
          EOF
          cat > stubsrc/com/bachatas4/android/data/ContentImportResult.java <<'EOF'
          package com.bachatas4.android.data; import com.bachatas4.android.model.Game; public class ContentImportResult { public ContentImportResult(Game g,long b,String s){} public Game getGame(){return null;} }
          EOF
          cat > stubsrc/com/bachatas4/android/data/GameRepository.java <<'EOF'
          package com.bachatas4.android.data; import com.bachatas4.android.model.Game; import kotlin.coroutines.Continuation;
          public class GameRepository { public Object addDirectGame(Game g,long t,Continuation<?> c){return null;} public Object addImportedGame(ContentImportResult r,String s,long t,Continuation<?> c){return null;} }
          EOF
          cat > stubsrc/com/bachatas4/android/data/PkgExportTarget.java <<'EOF'
          package com.bachatas4.android.data; public interface PkgExportTarget {}
          EOF
          cat > stubsrc/com/bachatas4/android/data/AndroidPkgExportTarget.java <<'EOF'
          package com.bachatas4.android.data; import android.content.ContentResolver; public class AndroidPkgExportTarget implements PkgExportTarget { public AndroidPkgExportTarget(ContentResolver r,String s){} public void checkWritable(){} }
          EOF
          cat > stubsrc/com/bachatas4/android/data/PkgTreePublisher.java <<'EOF'
          package com.bachatas4.android.data; import java.io.File; import kotlin.coroutines.Continuation; import kotlin.jvm.functions.Function1; import kotlin.jvm.functions.Function3;
          public class PkgTreePublisher { public PkgTreePublisher(PkgExportTarget t){} public static Object publish$default(PkgTreePublisher p,File f,String id,Function1 a,Function3 b,Continuation c,int mask,Object n){return null;} }
          EOF
          cat > stubsrc/com/bachatas4/android/model/GameStorageMode.java <<'EOF'
          package com.bachatas4.android.model; public enum GameStorageMode { MANAGED, DIRECT }
          EOF
          cat > stubsrc/com/bachatas4/android/model/Game.java <<'EOF'
          package com.bachatas4.android.model; import kotlin.jvm.internal.DefaultConstructorMarker;
          public class Game { public Game(String id,String title,String path,String subtitle,String detail,long last,GameStorageMode mode,String source,int mask,DefaultConstructorMarker marker){} public GameStorageMode getStorageMode(){return null;} }
          EOF
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          javac -source 8 -target 8 -cp "$ANDROID_JAR:kotlin-stdlib.jar:coroutines.jar" -d build $(find stubsrc -name '*.java') .github/tmp_externalpkg/ExternalPkgBridge.java
          D8=$(find "$ANDROID_HOME/build-tools" -type f -name d8 | sort -V | tail -1)
          mkdir helperdex
          "$D8" --min-api 26 --lib "$ANDROID_JAR" --classpath kotlin-stdlib.jar --classpath coroutines.jar --output helperdex build/com/bachatas4/android/service/ExternalPkgBridge*.class
          mv helperdex/classes.dex classes9.dex
      - name: Repack unsigned APK
        run: |
          set -eux
          rm -rf apkdir && mkdir apkdir
          unzip -q base.apk -d apkdir
          cp classes2-patched.dex apkdir/classes2.dex
          cp classes9.dex apkdir/classes9.dex
          rm -rf apkdir/META-INF
          (cd apkdir && zip -q -r -9 ../candidate-unaligned.apk .)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          "$ZIPALIGN" -f 4 candidate-unaligned.apk Bachata-S4-Plus-v0.2.3-EXTERNAL-PKG-MINIMAL-UNSIGNED.apk
          unzip -tq Bachata-S4-Plus-v0.2.3-EXTERNAL-PKG-MINIMAL-UNSIGNED.apk
          unzip -p Bachata-S4-Plus-v0.2.3-EXTERNAL-PKG-MINIMAL-UNSIGNED.apk classes2.dex | strings | grep -F 'ExternalPkgBridge'
          unzip -p Bachata-S4-Plus-v0.2.3-EXTERNAL-PKG-MINIMAL-UNSIGNED.apk classes9.dex | strings | grep -E 'PkgTreePublisher|addDirectGame|pkg-extraction'
      - uses: actions/upload-artifact@v4
        with:
          name: external-pkg-minimal-unsigned
          path: Bachata-S4-Plus-v0.2.3-EXTERNAL-PKG-MINIMAL-UNSIGNED.apk
