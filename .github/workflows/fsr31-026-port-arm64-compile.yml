name: Compile port rasterizer on Linux ARM64
on:
  push:
    branches: [feature/fsr31-026-port-rasterizer]
    paths:
      - '.github/workflows/fsr31-026-port-arm64-compile.yml'
      - 'tools/fsr31-026/port_apply_source.py'
      - 'tools/fsr31-026/port_camera_state.h'
      - 'tools/fsr31-026/port_camera_motion_math.h'
      - 'tools/fsr31-026/port_rasterizer_scene.h'
      - 'tools/fsr31-026/port_ui_surface.h'
      - 'tools/fsr31-026/core024_router.c'
      - 'tools/fsr31-026/port_native_dispatch.h'
permissions: {contents: read}
jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install native ARM64 Linux build prerequisites
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git clang lld cmake ninja-build nodejs python3 python3-mako python3-setuptools \
            llvm binutils-aarch64-linux-gnu build-essential pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxss-dev \
            libasound2-dev libpulse-dev libudev-dev libuuid1 uuid-dev \
            libvulkan-dev libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libegl1-mesa-dev libgles2-mesa-dev libfreetype-dev
      - name: Clone Bachata native ARM64 renderer and required submodules
        run: |
          set -euxo pipefail
          git clone --depth=1 --recurse-submodules --shallow-submodules --jobs=8 \
            https://github.com/zenithblue-oss/shadps4-arm64.git arm64-source
          git -C arm64-source rev-parse HEAD | tee arm64-source-revision.txt
      - name: Apply verified port camera and guest rasterizer hooks
        run: |
          set -euxo pipefail
          python3 tools/fsr31-026/port_apply_source.py arm64-source
          git -C arm64-source diff --check
          grep -Fq 'rasterizer->Fsr31PortOnPresentedFrame();' \
            arm64-source/src/video_core/renderer_vulkan/vk_presenter.cpp
      - name: Compile real ARM64 host with existing Bachata FEX engine
        run: |
          set -euxo pipefail
          bash arm64-source/runtime/scripts/build-shadps4-arm64.sh
          test -s arm64-source/runtime/build/shadps4-arm64/shadps4
          file arm64-source/runtime/build/shadps4-arm64/shadps4
          readelf -h arm64-source/runtime/build/shadps4-arm64/shadps4 \
            | grep -F 'Machine:' | grep -F 'AArch64'
          sha256sum arm64-source/runtime/build/shadps4-arm64/shadps4 \
            | tee arm64-patched-sha256.txt
      - name: Compile reversible core024 FSR3 ELF selector
        run: |
          set -euxo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -fPIE -pie \
            tools/fsr31-026/core024_router.c -o shadps4-arm64-024-router
          file shadps4-arm64-024-router | grep -Ei 'aarch64|ARM aarch64'
          readelf -h shadps4-arm64-024-router | grep -F 'AArch64'
          sha256sum shadps4-arm64-024-router
      - uses: actions/upload-artifact@v4
        with:
          name: PORT-ARM64-SOURCE-COMPILATION-VALIDATION
          path: |
            arm64-source-revision.txt
            arm64-patched-sha256.txt
            arm64-source/runtime/build/shadps4-arm64/shadps4
            shadps4-arm64-024-router
          retention-days: 7
