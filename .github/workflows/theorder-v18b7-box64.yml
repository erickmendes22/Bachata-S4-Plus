name: The Order V18B7 Box64 Hybrid

on:
  push:
    branches: [theorder-v18b7-build]
    paths:
      - '.github/workflows/theorder-v18b7-box64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4

      - name: Checkout Bachata-adapted shadPS4 source
        uses: actions/checkout@v4
        with:
          repository: zenithblue-oss/shadps4-arm64
          fetch-depth: 0
          submodules: recursive
          path: source

      - name: Port The Order AUX-GS commits
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          git config user.name 'V18B7 Builder'
          git config user.email 'actions@users.noreply.github.com'
          git config fetch.recurseSubmodules false
          git remote add theorder https://github.com/TdlifePeng/shadPS4.git
          git -c fetch.recurseSubmodules=false fetch --no-tags --recurse-submodules=no theorder \
            7db6e4ba56b98841624ab776aaa56763f10bdc89 \
            1a393198193e8f373dc6c0ce928cd2d7494802a5 \
            a5ecab35b216663e0e8400383a931efc2a0a44e5

          cherry_pick_theirs_on_conflict() {
            local c="$1"
            if ! git -c submodule.recurse=false cherry-pick "$c"; then
              mapfile -t conflicted < <(git diff --name-only --diff-filter=U)
              printf 'Resolving conflicts for %s with The Order implementation:\n' "$c"
              printf '  %s\n' "${conflicted[@]}"
              test "${#conflicted[@]}" -gt 0
              for f in "${conflicted[@]}"; do
                git checkout --theirs -- "$f"
                git add "$f"
              done
              git -c core.editor=true cherry-pick --continue
            fi
          }

          cherry_pick_theirs_on_conflict 7db6e4ba56b98841624ab776aaa56763f10bdc89
          cherry_pick_theirs_on_conflict 1a393198193e8f373dc6c0ce928cd2d7494802a5
          cherry_pick_theirs_on_conflict a5ecab35b216663e0e8400383a931efc2a0a44e5

          git status --short
          grep -R -n 'CanPerVertexInterp' src/shader_recompiler src/video_core
          grep -R -n -- '--bachata-socket' src/main.cpp
          grep -n '39-bit' src/core/address_space.cpp

      - name: Install build dependencies
        shell: bash
        working-directory: source
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang cmake pkg-config libx11-dev libxext-dev libwayland-dev libxkbcommon-dev libpulse-dev libasound2-dev libudev-dev libunwind-dev libssl-dev libzstd-dev libedit-dev libgl-dev libvulkan-dev

      - name: Build x86-64 Bachata core with AUX-GS
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          cmake --preset x64-Clang-Release \
            -DENABLE_BACHATA_RUNTIME=ON \
            -DENABLE_FEX_GUEST_CPU=OFF \
            -DENABLE_USERFAULTFD=OFF \
            -DENABLE_DISCORD_RPC=OFF \
            -DENABLE_UPDATER=OFF \
            -DENABLE_TESTS=OFF
          cmake --build Build/x64-Clang-Release --target shadps4 -j2
          CORE=Build/x64-Clang-Release/shadps4
          test -s "$CORE"
          file "$CORE"
          readelf -h "$CORE" | grep -E 'ELF64|X86-64'
          strings "$CORE" | grep -F -- '--bachata-socket' || true
          cp "$CORE" ../shadps4-v18b7-box64
          sha256sum ../shadps4-v18b7-box64 > ../shadps4-v18b7-box64.sha256

      - name: Upload hybrid core
        uses: actions/upload-artifact@v4
        with:
          name: TheOrder-V18B7-BOX64-HYBRID
          path: |
            shadps4-v18b7-box64
            shadps4-v18b7-box64.sha256
          retention-days: 7
