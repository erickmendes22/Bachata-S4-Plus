name: V20 Full Predication ARM64/FEX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v20:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout V20 control files
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout real shadPS4 ARM64 source
        uses: actions/checkout@v4
        with:
          repository: zenithblue-oss/shadps4-arm64
          fetch-depth: 0
          submodules: false
          path: source

      - name: Self-heal and hydrate submodules
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail

          hydrate_repo() {
            local root="$1"
            local depth="$2"
            (( depth > 5 )) && return 0
            [[ -f "$root/.gitmodules" ]] || return 0

            while read -r key path; do
              local name="${key#submodule.}"
              name="${name%.path}"
              local url branch target

              url="$(git -C "$root" config -f .gitmodules --get "submodule.$name.url" || true)"
              branch="$(git -C "$root" config -f .gitmodules --get "submodule.$name.branch" || true)"
              target="$root/$path"
              [[ -n "$url" ]] || continue

              git -C "$root" -c submodule.recurse=false submodule sync -- "$path" || true

              if ! git -C "$root" -c submodule.recurse=false                     submodule update --init --depth 1 -- "$path"; then
                rm -rf "$target"
                if [[ -n "$branch" ]]; then
                  git clone --depth 1 --branch "$branch" "$url" "$target" ||                   git clone --depth 1 "$url" "$target"
                else
                  git clone --depth 1 "$url" "$target"
                fi
              fi

              [[ -d "$target" ]] && hydrate_repo "$target" "$((depth + 1))" || true
            done < <(
              git -C "$root" config -f .gitmodules                 --get-regexp '^submodule\..*\.path$' 2>/dev/null || true
            )
          }

          hydrate_repo "." 0

      - name: Apply and auto-resolve real predication port
        shell: bash
        working-directory: source
        run: |
          bash ../control/runtime/v20/apply-full-predication.sh
          git diff --stat

      - name: Build V20 AArch64/FEX
        shell: bash
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE/source:/workspace"             -w /workspace             -e BACHATA_INSIDE_DEBIAN_CONTAINER=1             debian:trixie             bash -lc '
              set -euo pipefail
              bash runtime/scripts/install-debian-runtime-deps.sh
              bash runtime/scripts/build-shadps4-arm64.sh
            '

      - name: Locate and verify compiled FEX core
        shell: bash
        run: |
          set -euo pipefail
          cd source
          CORE="$(find runtime/build -type f             \( -name 'shadps4-arm64-fex' -o -name 'shadps4-arm64' -o -name 'shadps4' \)             -size +10M | head -n1)"
          test -n "$CORE"
          test -s "$CORE"
          file "$CORE"
          readelf -h "$CORE" | grep -E 'ELF64|AArch64'
          cp "$CORE" "$GITHUB_WORKSPACE/shadps4-arm64-fex"
          sha256sum "$GITHUB_WORKSPACE/shadps4-arm64-fex"             | tee "$GITHUB_WORKSPACE/V20-shadps4-arm64-fex.sha256"

      - name: Upload V20 compiled core
        uses: actions/upload-artifact@v7
        with:
          name: GOW3-V20-FULL-PREDICATION-shadps4-arm64-fex
          path: |
            shadps4-arm64-fex
            V20-shadps4-arm64-fex.sha256
          if-no-files-found: error
          retention-days: 7
