name: V20B Full Predication + New Presenter Baseline ARM64/FEX

on:
  workflow_dispatch:
  push:
    branches: [codex/gow3-v20-build]
    paths:
      - .github/workflows/v20-full-predication.yml
      - runtime/v20/**

permissions:
  contents: read

concurrency:
  group: gow3-v20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-v20:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout V20 control files
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout newer shadPS4 ARM64 source
        uses: actions/checkout@v4
        with:
          repository: zenithblue-oss/shadps4-arm64
          ref: 388cff5177f82e75a667d529212d34f3c255b7fc
          fetch-depth: 0
          submodules: false
          path: source

      - name: Self-heal and hydrate submodules
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail

          hydrate_repo() {
            local root="$1"
            local depth="$2"
            (( depth > 5 )) && return 0
            [[ -f "$root/.gitmodules" ]] || return 0

            while read -r key path; do
              local name="${key#submodule.}"
              name="${name%.path}"
              local url branch target

              url="$(git -C "$root" config -f .gitmodules --get "submodule.$name.url" || true)"
              branch="$(git -C "$root" config -f .gitmodules --get "submodule.$name.branch" || true)"
              target="$root/$path"
              [[ -n "$url" ]] || continue

              git -C "$root" -c submodule.recurse=false submodule sync -- "$path" || true

              if ! git -C "$root" -c submodule.recurse=false submodule update --init --depth 1 -- "$path"; then
                rm -rf "$target"
                if [[ -n "$branch" ]]; then
                  git clone --depth 1 --branch "$branch" "$url" "$target" || git clone --depth 1 "$url" "$target"
                else
                  git clone --depth 1 "$url" "$target"
                fi
              fi

              [[ -d "$target" ]] && hydrate_repo "$target" "$((depth + 1))" || true
            done < <(
              git -C "$root" config -f .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null || true
            )
          }

          hydrate_repo "." 0

      - name: Apply V20B predication port without regressing newer renderer
        shell: bash
        working-directory: source
        run: |
          bash ../control/runtime/v20/apply-full-predication.sh
          git diff --cached --stat

      - name: Build V20B AArch64/FEX
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/source:/workspace" \
            -w /workspace \
            -e BACHATA_INSIDE_DEBIAN_CONTAINER=1 \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              bash runtime/scripts/install-debian-runtime-deps.sh
              git config --global --add safe.directory "*"
              bash runtime/scripts/build-shadps4-arm64.sh
            '

      - name: Locate and verify compiled FEX core
        shell: bash
        run: |
          set -euo pipefail
          cd source
          CORE=runtime/build/shadps4-arm64-stage/bin/shadps4-arm64
          test -s "$CORE"
          file "$CORE"
          HEADER="$(readelf -h "$CORE")"
          grep -Eq 'Class:[[:space:]]+ELF64' <<< "$HEADER"
          grep -Eq 'Machine:[[:space:]]+AArch64' <<< "$HEADER"
          cp "$CORE" "$GITHUB_WORKSPACE/shadps4-arm64-fex"
          cp runtime/build/shadps4-arm64-stage/needed.txt "$GITHUB_WORKSPACE/V20B-needed.txt"
          sha256sum "$GITHUB_WORKSPACE/shadps4-arm64-fex" | tee "$GITHUB_WORKSPACE/V20B-shadps4-arm64-fex.sha256"
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "control_commit=${{ github.sha }}"
            echo "predication_upstream=3559530df5aec4067a95912af13ef14896b65ada"
            echo "official_021_binary_build_id=4ae158bf466fa2fe6d80e13b5538a302af90fbb2"
            sha256sum ../control/runtime/v20/full-predication-arm64.patch
          } > "$GITHUB_WORKSPACE/V20B-build-info.txt"

      - name: Upload V20B compiled core
        uses: actions/upload-artifact@v7
        with:
          name: GOW3-V20B-NEWBASE-FULL-PREDICATION-shadps4-arm64-fex
          path: |
            shadps4-arm64-fex
            V20B-shadps4-arm64-fex.sha256
            V20B-needed.txt
            V20B-build-info.txt
          if-no-files-found: error
          retention-days: 7
