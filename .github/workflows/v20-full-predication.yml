name: V20 Full Predication ARM64/FEX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v20:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout V20 control files
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout real shadPS4 ARM64 source
        uses: actions/checkout@v4
        with:
          repository: zenithblue-oss/shadps4-arm64
          fetch-depth: 0
          submodules: false
          path: source

      - name: Initialize shadPS4 submodules with libusb recovery
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git submodule sync

          # Initialize every first-level submodule except the broken libusb pin.
          while read -r key path; do
            [ "$path" = "externals/libusb" ] && continue
            echo "==> submodule $path"
            git submodule update --init --recursive -- "$path"
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$')

          # The fork currently pins a libusb object that GitHub can intermittently
          # refuse as "not our ref". Use the repository's intended shadps4 branch.
          rm -rf externals/libusb
          git clone --depth 1 --branch shadps4 https://github.com/shadexternals/libusb.git externals/libusb

          echo "libusb recovery HEAD:"
          git -C externals/libusb rev-parse HEAD

      - name: Apply shadPS4 real conditional-rendering predication
        shell: bash
        working-directory: source
        run: |
          bash ../control/runtime/v20/apply-full-predication.sh
          git diff --stat

      - name: Build V20 AArch64/FEX inside Debian Trixie
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/source:/workspace" \
            -w /workspace \
            -e BACHATA_INSIDE_DEBIAN_CONTAINER=1 \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              bash runtime/scripts/install-debian-runtime-deps.sh
              bash runtime/scripts/build-shadps4-arm64.sh
            '

      - name: Locate and verify compiled FEX core
        shell: bash
        run: |
          set -euo pipefail
          cd source
          CORE="$(find runtime -type f \( -name 'shadps4-arm64-fex' -o -name 'shadps4-arm64' \) -size +10M | head -n1)"
          test -n "$CORE"
          test -s "$CORE"
          echo "Compiled core: $CORE"
          file "$CORE"
          readelf -h "$CORE" | grep -E 'ELF64|AArch64'
          cp "$CORE" "$GITHUB_WORKSPACE/shadps4-arm64-fex"
          sha256sum "$GITHUB_WORKSPACE/shadps4-arm64-fex" | tee "$GITHUB_WORKSPACE/V20-shadps4-arm64-fex.sha256"

      - name: Upload V20 compiled core
        uses: actions/upload-artifact@v7
        with:
          name: GOW3-V20-FULL-PREDICATION-shadps4-arm64-fex
          path: |
            shadps4-arm64-fex
            V20-shadps4-arm64-fex.sha256
          if-no-files-found: error
          retention-days: 7
