name: Quick Release 0.2.6 SRT GPU page source-parity gate
on:
  push:
    branches: [feature/release026-srt-page-readback-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-srt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct actual FEX ARM64 merged with pinned shadPS4 0.18.1
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/zenithblue-oss/shadps4-arm64.git core
          git -C core checkout --quiet be6bc2e9c60799e071dd2fafa6216e8d80ec619c
          git -C core config user.name 'Release parity source ABI test'
          git -C core config user.email 'release-parity@users.noreply.github.com'
          git -C core remote add shadps4 https://github.com/shadps4-emu/shadPS4.git
          git -C core fetch --quiet --filter=blob:none shadps4 3912336fdfffbd5c99b59d92e997ea6ebd62216c
          python3 bionic/source0181/rebase_arm64.py --source core --output out/source0181
          python3 bionic/source0181/port_0181.py --source core --report out/source0181/bionic-0181-parity.json
      - name: Enforce SRT source tracking, mapped pages, and real GPU download
        run: |
          set -euo pipefail
          python3 bionic/source0181/assert_native_api.py --source core
          grep -Fq 'BACHATA_RELEASE026_SRT_GPU_PAGE_READBACK' core/src/video_core/renderer_vulkan/vk_rasterizer.cpp
          grep -Fq 'srt_guest_sources.assign(' core/src/shader_recompiler/info.h
          grep -Fq 'if (source_addresses && guest_read_ok)' core/src/shader_recompiler/ir/passes/flatten_extended_userdata_pass.cpp
          grep -Fq 'buffer_cache.ReadMemory(page,PageSize,false,true)' core/src/video_core/renderer_vulkan/vk_rasterizer.cpp
          ! grep -Fq 'std::atomic_ref<u32>(ops[i]).fetch_or(SrtZeroed' core/src/shader_recompiler/ir/passes/flatten_extended_userdata_pass.cpp
          git -C core diff --check
          echo 'RELEASE026_GPU_WRITTEN_SRT_SOURCE_PARITY_PASS'
