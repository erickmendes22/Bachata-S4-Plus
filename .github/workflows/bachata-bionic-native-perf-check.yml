name: Bionic native performance validation (isolated branch)
on:
  push:
    branches: [work/bionic-native-perf-20261124]
    paths:
      - 'bionic/source0181/**'
      - '.github/workflows/bachata-bionic-native-perf-check.yml'
  workflow_dispatch:
concurrency:
  group: bionic-native-perf-check
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checked-srt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile native emitter and validate ARM64 execution
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror bionic/source0181/test_checked_srt_jit.cpp -o /tmp/srt-host
          /tmp/srt-host
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread bionic/source0181/test_parallel_physical_upload.cpp -o /tmp/physical-upload
          /tmp/physical-upload
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread bionic/source0181/test_ahb_release_slots.cpp -o /tmp/ahb-slots
          /tmp/ahb-slots
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-aarch64-linux-gnu qemu-user
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -static bionic/source0181/test_checked_srt_jit.cpp -o /tmp/srt-arm64
          qemu-aarch64 /tmp/srt-arm64
      - name: Validate Python overlay
        run: python3 -m py_compile bionic/source0181/*.py

  source-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct pinned native sources and verify all anchors
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/zenithblue-oss/shadps4-arm64.git generic-upstream
          git -C generic-upstream checkout --quiet be6bc2e9c60799e071dd2fafa6216e8d80ec619c
          git -C generic-upstream config user.name 'Bachata Source Port CI'
          git -C generic-upstream config user.email 'source-port@users.noreply.github.com'
          git -C generic-upstream remote add shadps4 https://github.com/shadps4-emu/shadPS4.git
          git -C generic-upstream fetch --quiet --filter=blob:none shadps4 3912336fdfffbd5c99b59d92e997ea6ebd62216c
          python3 bionic/source0181/rebase_arm64.py --source generic-upstream --output out/source0181
          python3 bionic/source0181/port_0181.py --source generic-upstream --report out/source0181/bionic-0181-parity.json
          python3 bionic/source0181/assert_native_api.py --source generic-upstream
          git -C generic-upstream diff --check
