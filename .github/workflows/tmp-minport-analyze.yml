name: tmp-minport-analyze
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-minport-analyze.yml']
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode target
        run: |
          set -eux
          curl -L 'https://github.com/erickmendes22/Bachata-S4-Plus/releases/download/0.2.3/Bachata-S4-Plus-v0.2.3.apk' -o /tmp/target.apk
          curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest > /tmp/apktool.json
          URL=$(jq -r '.assets[] | select(.name|endswith(".jar")) | .browser_download_url' /tmp/apktool.json | head -1)
          curl -L "$URL" -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d -f -r /tmp/target.apk -o /tmp/decoded
          mkdir -p tmp-minport-smali
          {
            echo '=== ImportService finalizeStagingTree refs ==='
            grep -n -B 70 -A 100 'finalizeStagingTree' /tmp/decoded/smali_classes2/com/bachatas4/android/service/ImportService.smali || true
            echo '=== EmulationService RuntimeProcessRequest refs ==='
            grep -n -B 100 -A 120 'RuntimeProcessRequest;-><init>' /tmp/decoded/smali_classes2/com/bachatas4/android/service/EmulationService.smali || true
            echo '=== EmulationService game path setup ==='
            grep -n -B 80 -A 150 'Game directory escapes app storage' /tmp/decoded/smali_classes2/com/bachatas4/android/service/EmulationService.smali || true
            echo '=== AndroidPkgExportTarget ==='
            cat /tmp/decoded/smali_classes8/com/bachatas4/android/data/AndroidPkgExportTarget.smali || true
            echo '=== SafGameBroker ==='
            cat /tmp/decoded/smali_classes8/com/bachatas4/android/service/SafGameBroker.smali || true
          } > tmp-minport-smali/analysis.txt
      - name: Commit analysis
        run: |
          git config user.name 'minport-analysis'
          git config user.email 'actions@users.noreply.github.com'
          git add tmp-minport-smali/analysis.txt
          git commit -m 'tmp: minport analysis refs' || exit 0
          git push
