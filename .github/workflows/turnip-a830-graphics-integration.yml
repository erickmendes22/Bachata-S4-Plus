name: Turnip A830 pinned source integration
on:
  push:
    branches: [fix/a830-gamehub-regular-indexed-guards-r9-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip patch clang lld llvm
          sudo python3 -m pip install --break-system-packages 'meson>=1.5' mako pyyaml packaging
      - name: Pinned StevenMXZ V38 recipe
        run: |
          git clone --depth=1 -b A8xx https://github.com/StevenMXZ/Adreno-Tools-Drivers.git turnip-recipe
          git -C turnip-recipe fetch --depth=1 origin b3b32ad30e7d7b4bd897e678af064036eeb9df09
          git -C turnip-recipe checkout --detach b3b32ad30e7d7b4bd897e678af064036eeb9df09
      - name: Use rebased A8xx patches without retired IB cache
        run: |
          git clone --depth=1 -b A8xx https://github.com/The412Banner/Banners-Turnip.git rebased
          git -C rebased fetch --depth=1 origin 7fffd01ddb5651d72a05dd0b12b84977cb95d397
          git -C rebased checkout --detach 7fffd01ddb5651d72a05dd0b12b84977cb95d397
          for n in 1 2 3 4 5; do
            old=$(find turnip-recipe/patches/patchs1 -maxdepth 1 -name "000$n-*.patch" -type f)
            new=$(find rebased/patches/a8xx-winnative -maxdepth 1 -name "000$n-*.patch" -type f)
            test -n "$old" && test -n "$new"
            rm "$old"
            cp "$new" turnip-recipe/patches/patchs1/
          done
          rm turnip-recipe/patches/patchs1/0006-*.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path("turnip-recipe/build_turnip.sh")
          s=p.read_text()
          assert s.count('[ "$count" -eq 6 ]')==1
          s=s.replace('[ "$count" -eq 6 ]','[ "$count" -eq 5 ]')
          start=s.index('            log "A8xx Patchs1: applying KGSL zero-timeout poll fix..."')
          end=s.index('            ;;',start)
          guard="            grep -Fq 'return kgsl_poll_timestamp(device, context_id, timestamp);' src/freedreno/vulkan/tu_knl_kgsl.cc || die 'KGSL zero-timeout poll fix missing from pinned Mesa'\n"
          s=s[:start]+guard+s[end:]
          p.write_text(s)
          PY
      - name: Integrate A830 fix with source guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('turnip-recipe/build_turnip.sh')
          s=p.read_text()
          needle="    apply_android_ndk_fixes\n    build_android\n"
          assert s.count(needle)==1, "Recipe mismatch; no modifications allowed"
          hook="""    # Native A830/WinNative corrections are already pinned in patches 0001-0005.
              # Don't stack the unrelated experimental LRZ patch again.
              # Restore the previously shipped native A830 barycentric path;
              # never advertise the Vulkan extension without the IR3 conversion.
              # Backport actual upstream Mesa fixes newer than pin f28352d (2026-10-19).
              # These are NOT the older experimental indexed-draw split patch.
              for p in shared-const-invalidate hull-shader a8xx-indirect-split a8xx-indirect-count-split nir-drawid-offset ir3-drawid-offset vsparams-rename vsparams-split drawid-ubo; do
                fix="$GITHUB_WORKSPACE/tools/turnip-a830/upstream/${p}.patch"
                git apply --check "$fix" || die "Upstream patch mismatch: $p"
                git apply "$fix" || die "Upstream patch apply failed: $p"
              done
              python3 "$GITHUB_WORKSPACE/tools/turnip-a830/apply_native_barycentrics.py"
              python3 "$GITHUB_WORKSPACE/tools/turnip-a830/apply_gamehub_selective_renderpass.py"
              python3 "$GITHUB_WORKSPACE/tools/turnip-a830/apply_gamehub_depth_range_unrestricted.py"
              python3 "$GITHUB_WORKSPACE/tools/turnip-a830/apply_gamehub_a830_fdm_full_density.py"
              python3 "$GITHUB_WORKSPACE/tools/turnip-a830/apply_gamehub_a830_subgroup64.py"
              python3 "$GITHUB_WORKSPACE/tools/turnip-a830/apply_gamehub_a830_legacy_subpass_sync.py"
              python3 "$GITHUB_WORKSPACE/tools/turnip-a830/apply_gamehub_a830_blit_clean_visibility.py"
              python3 "$GITHUB_WORKSPACE/tools/turnip-a830/apply_gamehub_a830_rgb96_formats.py"
              python3 "$GITHUB_WORKSPACE/tools/turnip-a830/apply_gamehub_a830_rgb96_copy.py"
              python3 "$GITHUB_WORKSPACE/tools/turnip-a830/apply_gamehub_gralloc_metadata_parity.py" src/util/u_gralloc/u_gralloc_aimapper.c
              python3 "$GITHUB_WORKSPACE/tools/turnip-a830/apply_gamehub_gralloc_qti_loader.py" src/util/u_gralloc/u_gralloc_aimapper.c
              python3 "$GITHUB_WORKSPACE/tools/turnip-a830/apply_gamehub_gpu_properties.py" src/freedreno/common/freedreno_devices.py
              python3 "$GITHUB_WORKSPACE/tools/turnip-a830/apply_gamehub_regular_indexed_guarded_r9.py" src/freedreno/ir3/ir3_compiler_nir.c src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq "prim_alloc_threshold = 0xF" src/freedreno/common/freedreno_devices.py
              grep -Fq 'GameHub A830 gralloc: legacy FD/stride' src/util/u_gralloc/u_gralloc_aimapper.c
              grep -Fq 'u_gralloc_fallback_create()' src/util/u_gralloc/u_gralloc_aimapper.c
              grep -Fq 'mapper.qti.so' src/util/u_gralloc/u_gralloc_aimapper.c
              grep -Fq 'libmain_hook.so' src/util/u_gralloc/u_gralloc_aimapper.c
              grep -Fq 'gamehub_a830_rgb96_buffer_image' src/freedreno/vulkan/tu_clear_blit.cc
              grep -Fq 'gamehub_a830_rgb96_image' src/freedreno/vulkan/tu_formats.cc
              grep -Fq 'force_linear_tile = true;' src/freedreno/vulkan/tu_image.cc
              # Fail closed if any of the three upstream shader/draw fixes vanish.
              grep -Fq 'gamehub_can_split_regular_indexed' src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq 'gamehub_vs->has_no_side_effects' src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq 'gamehub_vs->num_sampler_prefetch == 0' src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq '!gamehub_fs->reads_primid' src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq 'tu_indirect_draw_max_count(' src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq 'tu6_emit_indirect_count_split(' src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq 'draw_id_offset = draw_id_offset' src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq 'nir_intrinsic_load_draw_id_offset_ir3' src/freedreno/ir3/ir3_nir.c
              grep -Fq 'PC_HS_PARAM_0(CHIP, MAX2(' src/freedreno/vulkan/tu_pipeline.cc
              grep -Fq 'tu6_emit_shared_consts_enable<CHIP>(crb, shared_consts_enable);' src/freedreno/vulkan/tu_pipeline.cc
              grep -Fq '.gfx_shared_const = CHIP == A6XX' src/freedreno/vulkan/tu_pipeline.cc
              grep -Fq '.cs_shared_const = CHIP == A6XX' src/freedreno/vulkan/tu_shader.cc
              grep -Fq 'gamehub_a830_legacy_blit_clean' src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq 'gamehub_a830_legacy_subpass' src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq 'tu_emit_event_write<CHIP>(cmd_buffer, cs, FD_CACHE_INVALIDATE);' src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq 'gamehub_a830_wave64' src/freedreno/vulkan/tu_device.cc
              grep -Fq 'p->maxSubgroupSize : tu_min_subgroup_size(pdevice)' src/freedreno/vulkan/tu_device.cc
              grep -Fq 'gamehub_a830_full_density' src/freedreno/vulkan/tu_tile_config.cc
              grep -Fq 'if (fdm && !gamehub_a830_full_density)' src/freedreno/vulkan/tu_tile_config.cc
              grep -Fq '.EXT_depth_range_unrestricted =' src/freedreno/vulkan/tu_device.cc
              grep -Fq 'device->dev_id.chip_id == 0xffff44050001ull' src/freedreno/vulkan/tu_device.cc
              grep -Fq 'tu_gamehub_a8xx_msaa8_needs_sysmem' src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq 'tu_gamehub_a8xx_multipass_msaa_needs_sysmem' src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq 'tu_gamehub_a8xx_d32s8_msaa_input_prefers_gmem' src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq 'multi-subpass MSAA without input attachments requires sysmem' src/freedreno/vulkan/tu_cmd_buffer.cc
              ! grep -Fq 'A830 GMEM page-write workaround' src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq 'ir3_lower_khr_barycentrics_cb' src/freedreno/ir3/ir3_nir.c
              grep -Fq 'nir_intrinsic_has_interp_mode(baryc)' src/freedreno/ir3/ir3_compiler_nir.c
              grep -Fq 'features->fragmentShaderBarycentric = pdevice->info->chip >= A8XX;' src/freedreno/vulkan/tu_device.cc
              grep -Fq 'cube_coord_hang_quirk' src/freedreno/ir3/ir3_nir.c
              grep -Fq 'kgsl_bo_create_alias' src/freedreno/vulkan/tu_knl_kgsl.cc
              grep -Fq 'kgsl_bo_destroy_alias' src/freedreno/vulkan/tu_knl_kgsl.cc
              grep -Fq 'A6XX_SP_CS_BINDLESS_INVALIDATE' src/freedreno/vulkan/tu_cmd_buffer.cc
              grep -Fq 'A6XX_SP_GFX_BINDLESS_INVALIDATE' src/freedreno/vulkan/tu_cmd_buffer.cc
          """
          p.write_text(s.replace(needle,hook+needle))
          PY
          python3 -m py_compile tools/turnip-a830/apply_native_barycentrics.py tools/turnip-a830/apply_gamehub_selective_renderpass.py tools/turnip-a830/apply_gamehub_depth_range_unrestricted.py tools/turnip-a830/apply_gamehub_a830_fdm_full_density.py tools/turnip-a830/apply_gamehub_a830_subgroup64.py tools/turnip-a830/apply_gamehub_a830_legacy_subpass_sync.py tools/turnip-a830/apply_gamehub_a830_blit_clean_visibility.py tools/turnip-a830/apply_gamehub_a830_rgb96_formats.py tools/turnip-a830/apply_gamehub_a830_rgb96_copy.py tools/turnip-a830/apply_gamehub_gralloc_metadata_parity.py tools/turnip-a830/apply_gamehub_gralloc_qti_loader.py tools/turnip-a830/apply_gamehub_regular_indexed_guarded_r9.py tools/turnip-a830/apply_gamehub_gpu_properties.py tools/turnip-a830/verify_gamehub_gpu_threshold.py
          bash -n turnip-recipe/build_turnip.sh
      - name: Compile Android KGSL driver
        env:
          VARIANT: a8xx-patchs1
          MESA_COMMIT: f28352d1179a4a85b4be286a883747bae2d3786b
          BUILD_VERSION: a830-gamehub-regular-indexed-r9
        run: |
          cd turnip-recipe
          bash build_turnip.sh
      - name: Check ELF and no regressions
        run: |
          set -euo pipefail
          test "$(find turnip-recipe/turnip_workdir -maxdepth 1 -name 'Turnip_*.zip' -type f | wc -l)" -eq 1
          driver_zip=$(find turnip-recipe/turnip_workdir -maxdepth 1 -name 'Turnip_*.zip' -type f -print -quit)
          unzip -t "$driver_zip"
          unzip -p "$driver_zip" libvulkan_freedreno.so > /tmp/a830.so
          readelf -h /tmp/a830.so | grep -q AArch64
          strings /tmp/a830.so | grep -q cube_coord_hang_quirk
          strings /tmp/a830.so | grep -q 'GameHub A830 gralloc:'
          strings /tmp/a830.so | grep -q 'GraphicBufferMapper20getPixelFormatFourCC'
          strings /tmp/a830.so | grep -q 'binding IB alias failed'
          python3 tools/turnip-a830/verify_gamehub_gpu_threshold.py v38 /tmp/a830.so
          sha256sum /tmp/a830.so "$driver_zip" > turnip-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: turnip-a830-gamehub-regular-indexed-r9
          path: |
            turnip-recipe/turnip_workdir/Turnip_*.zip
            turnip-sha256.txt
          if-no-files-found: error
          retention-days: 14
