name: Turnip Gen39 A840 native KGSL without IB cache
on:
  push:
    branches: [build/spiderman2-gen39-nativekgsl-no-ibcache-r3-20261119]
    paths: [.github/workflows/turnip-a830-graphics-integration.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip patch clang lld llvm
          sudo python3 -m pip install --break-system-packages 'meson>=1.5' mako pyyaml packaging
      - name: Restore Gen39 patched and exact native KGSL timeline MR39751
        run: |
          set -euo pipefail
          git clone --depth=1 --branch v39 https://github.com/StevenMXZ/Adreno-Tools-Drivers.git turnip-recipe
          test "$(git -C turnip-recipe rev-parse HEAD)" = b3b32ad30e7d7b4bd897e678af064036eeb9df09
          git clone --depth=1 --branch A8xx https://github.com/The412Banner/Banners-Turnip.git shader-reference
          git -C shader-reference fetch --depth=1 origin f3940f460744114a09a3cf39ae5f1e293785b2fe
          git -C shader-reference checkout --detach f3940f460744114a09a3cf39ae5f1e293785b2fe
          mkdir -p turnip-recipe/patches/spiderman2
          git -C shader-reference show f3940f460744114a09a3cf39ae5f1e293785b2fe:39751.patch > turnip-recipe/patches/spiderman2/39751.patch
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path("turnip-recipe/patches/spiderman2/39751.patch")
          source=p.read_text()
          starts=[m.start() for m in re.finditer(r'^From [0-9a-f]{40} Mon Sep 17 00:00:00 2001$',source,re.M)]
          assert len(starts)==2, "expected upstream MR39751 as two sequential patches"
          (p.parent/"39751-1.patch").write_text(source[starts[0]:starts[1]])
          (p.parent/"39751-2.patch").write_text(source[starts[1]:])
          PY
          # Rebase only patches 0001-0005 to the previously compiled f28352d base.
          git -C shader-reference fetch --depth=1 origin 7fffd01ddb5651d72a05dd0b12b84977cb95d397
          for n in 1 2 3 4 5; do
            old="$(find turnip-recipe/patches/patchs1 -maxdepth 1 -name "000$n-*.patch" -type f -print -quit)"
            source="$(git -C shader-reference ls-tree -r --name-only 7fffd01ddb5651d72a05dd0b12b84977cb95d397 | grep "^patches/a8xx-winnative/000$n-.*\.patch$")"
            test -n "$old" && test -n "$source"
            rm "$old"
            git -C shader-reference show "7fffd01ddb5651d72a05dd0b12b84977cb95d397:$source" > "turnip-recipe/patches/patchs1/$(basename "$source")"
          done
          # 0006 has an O(n) linked-list scan for retired-IB reuse and was removed elsewhere after A840 issues.
          # Preserve the original alias/unbind fix 0005 and the working native KGSL timeline implementation.
          cache_patch="$(find turnip-recipe/patches/patchs1 -maxdepth 1 -name '0006-*.patch' -type f -print -quit)"
          test -n "$cache_patch"
          grep -Fq 'Cache retired A8XX IB storage' "$cache_patch"
          rm "$cache_patch"
          test "$(find turnip-recipe/patches/patchs1 -maxdepth 1 -name '000[1-5]-*.patch' | wc -l)" -eq 5
          test "$(find turnip-recipe/patches/patchs1 -maxdepth 1 -name '0006-*.patch' | wc -l)" -eq 0
      - name: Compile source-rebased native KGSL timelines after original V39 patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("turnip-recipe/build_turnip.sh")
          s=p.read_text()
          old_count='[ "$count" -eq 6 ]'
          assert s.count(old_count)==1, "V39 recipe patch count changed"
          s=s.replace(old_count,'[ "$count" -eq 5 ]',1)
          old_desc='desc="Patchs1 Android/Bionic balanced recipe + extra 0001-0006 A8xx patchset"'
          assert s.count(old_desc)==1, "V39 metadata description changed"
          s=s.replace(old_desc, 'desc="Gen39 patches 0001-0005 + native KGSL timelines; O(n) retired IB cache removed"', 1)
          old_log='A8xx Patchs1: applying extra patchset 0001-0006...'
          assert s.count(old_log)==1, "V39 patch log changed"
          s=s.replace(old_log,'A8xx Patchs1: applying extra patchset 0001-0005...',1)
          old="            apply_patchs1_extra_patches\n"
          assert s.count(old)==1,"V39 patch hook changed"
          hook='''            apply_patchs1_extra_patches
                      # Source-specific rebase of MR39751 against Mesa f28352d, preserving syncobj submission.
                      python3 "$GITHUB_WORKSPACE/tools/turnip-a830/port_kgsl_timeline.py" "$PWD" "$REPO_ROOT/patches/spiderman2"
                      grep -Fq 'KGSL_GPU_AUX_COMMAND_TIMELINE' src/freedreno/vulkan/tu_knl_kgsl.cc || die "GPU timeline signal missing"
                      grep -Fq 'KGSL_TIMELINE_WAIT' src/freedreno/vulkan/tu_knl_kgsl.cc || die "Kernel timeline wait missing"
          '''
          s=s.replace(old,hook,1)
          old='pretty_name="Turnip A8xx Patched Patchs1"'
          assert s.count(old)==1
          s=s.replace(old,'pretty_name="Turnip Gen39 A840 Native KGSL No IB Cache"',1)
          old='suffix="A8xx-Patched-Patchs1"'
          assert s.count(old)==1
          s=s.replace(old,'suffix="Gen39-A840-NativeKGSL-NoIBCache"',1)
          start=s.index('            if ! git apply --check "$poll_patch"; then')
          end=s.index('            ;;',start)
          s=s[:start]+'''            # Mesa f28352d already has the nonblocking KGSL poll implementation.
                      if grep -Fq 'return kgsl_poll_timestamp(device, context_id, timestamp);' src/freedreno/vulkan/tu_knl_kgsl.cc; then
                        log 'Upstream KGSL nonblocking poll already present'
                      elif git apply --check "$poll_patch"; then
                        git apply "$poll_patch"
                      else
                        die 'Nonblocking KGSL poll missing'
                      fi
          '''+s[end:]
          p.write_text(s)
          PY
          bash -n turnip-recipe/build_turnip.sh
          test -s turnip-recipe/patches/spiderman2/39751-1.patch
          test -s turnip-recipe/patches/spiderman2/39751-2.patch
      - name: Build A840 Turnip Gen39 with native timelines
        env:
          VARIANT: a8xx-patchs1
          MESA_COMMIT: f28352d1179a4a85b4be286a883747bae2d3786b
          BUILD_VERSION: 39-spiderman2-nativekgsl-r3
        run: |
          cd turnip-recipe
          bash build_turnip.sh
      - name: Capture precise Gen39 sources and MR for source-level rebase
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gen39-A840-KGSL-source-rebase
          path: |
            turnip-recipe/turnip_workdir/mesa/src/freedreno/vulkan/tu_knl_kgsl.cc
            turnip-recipe/turnip_workdir/mesa/src/freedreno/vulkan/tu_common.h
            turnip-recipe/turnip_workdir/mesa/src/freedreno/vulkan/tu_device.h
            turnip-recipe/turnip_workdir/mesa/src/freedreno/vulkan/tu_queue.h
            turnip-recipe/turnip_workdir/mesa/src/vulkan/runtime/vk_semaphore.c
            turnip-recipe/patches/spiderman2/39751.patch
            turnip-recipe/patches/spiderman2/39751-1.patch
            turnip-recipe/patches/spiderman2/39751-2.patch
          if-no-files-found: error
      - name: Verify ZIP and architecture
        run: |
          set -euo pipefail
          driver="$(find turnip-recipe/turnip_workdir -maxdepth 1 -name 'Turnip_Gen39-A840-NativeKGSL-NoIBCache_*.zip' -type f -print -quit)"
          test -n "$driver"
          unzip -t "$driver"
          unzip -p "$driver" meta.json | python3 -m json.tool
          unzip -p "$driver" libvulkan_freedreno.so >/tmp/turnip-native.so
          readelf -h /tmp/turnip-native.so | grep -q AArch64
          if LC_ALL=C grep -aFq TU_KGSL_IB_CACHE /tmp/turnip-native.so; then
            echo "Unexpected retired-IB cache in r3 binary" >&2
            exit 1
          fi
          LC_ALL=C grep -aFq 'kgsl_timeline_wait failed' /tmp/turnip-native.so
          unzip -p "$driver" meta.json | grep -Fq 'O(n) retired IB cache removed'
          sha256sum "$driver" >turnip-recipe/turnip_workdir/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Turnip-Gen39-A840-SpiderMan2-NativeKGSL-NoIBCache
          path: |
            turnip-recipe/turnip_workdir/Turnip_Gen39-A840-NativeKGSL-NoIBCache_*.zip
            turnip-recipe/turnip_workdir/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
      - name: Publish direct Winlator driver ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gen39-a840-spiderman2-nativekgsl-r3-noibcache
          target_commitish: ${{ github.sha }}
          name: Turnip Gen39 A840 native KGSL no IB cache r3
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Experimental A840 driver with Mesa MR39751 native KGSL timelines.
            Same Mesa f28352d and native KGSL timeline port as r2. Only the linear-scan retired-IB cache 0006 is removed; 0001-0005 remain. No IR3 shuffle experiment.
            Kernel timeline support is detected at runtime, with fallback.
            Performance and full D3D12 Feature Level support require real-device verification.
            Download the .zip asset under Releases directly for Winlator AdrenoTools.
          files: turnip-recipe/turnip_workdir/Turnip_Gen39-A840-NativeKGSL-NoIBCache_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
