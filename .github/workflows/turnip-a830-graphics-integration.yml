name: Turnip Gen39 A840 Spider-Man 2 KGSL FORCE_32BIT fix
on:
  push:
    branches: [build/spiderman2-gen39-kgsl-force32-20261119]
    paths: [.github/workflows/turnip-a830-graphics-integration.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip patch clang lld llvm
          sudo python3 -m pip install --break-system-packages 'meson>=1.5' mako packaging pyyaml
      - name: Restore original Gen39 patched and source-matched shader fix
        run: |
          set -euo pipefail
          git clone --depth=1 --branch v39 https://github.com/StevenMXZ/Adreno-Tools-Drivers.git turnip-recipe
          test "$(git -C turnip-recipe rev-parse HEAD)" = b3b32ad30e7d7b4bd897e678af064036eeb9df09
          git clone --depth=1 --branch A8xx https://github.com/The412Banner/Banners-Turnip.git shader-reference
          git -C shader-reference fetch --depth=1 origin f3940f460744114a09a3cf39ae5f1e293785b2fe
          git -C shader-reference checkout --detach f3940f460744114a09a3cf39ae5f1e293785b2fe
          mkdir -p turnip-recipe/patches/spiderman2
          cp shader-reference/patches/a8xx-dd/0006-ir3-shuffle-broadcast.patch turnip-recipe/patches/spiderman2/shuffle.patch
          # Use the previously proven A8xx patch series for Mesa f28352d, not the newer main rebases.
          git -C shader-reference fetch --depth=1 origin 7fffd01ddb5651d72a05dd0b12b84977cb95d397
          for n in 1 2 3 4 5; do
            old="$(find turnip-recipe/patches/patchs1 -maxdepth 1 -name "000$n-*.patch" -type f -print -quit)"
            source="$(git -C shader-reference ls-tree -r --name-only 7fffd01ddb5651d72a05dd0b12b84977cb95d397 | grep "^patches/a8xx-winnative/000$n-.*\.patch$")"
            test -n "$old" && test -n "$source"
            rm "$old"
            git -C shader-reference show "7fffd01ddb5651d72a05dd0b12b84977cb95d397:$source" > "turnip-recipe/patches/patchs1/$(basename "$source")"
          done
          rm turnip-recipe/patches/patchs1/0006-*.patch
      - name: Integrate performance changes using Gen39's own builder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('turnip-recipe')
          assert not list((root/'patches/patchs1').glob('0006-*.patch')), 'Unsafe IB cache still present'
          f=root/'build_turnip.sh'
          s=f.read_text()
          def sub(old,new):
              global s
              assert s.count(old)==1, 'V39 recipe mismatch: '+old[:65]
              s=s.replace(old,new,1)
          sub('            apply_patchs1_extra_patches\n','''            apply_patchs1_extra_patches
                      shuffle_patch="$REPO_ROOT/patches/spiderman2/shuffle.patch"
                      if grep -Fq 'make_shuffle_mixed(' src/freedreno/ir3/ir3_lower_subgroups.c; then
                        log 'IR3 shuffle improvement already upstream'
                      elif git apply --check "$shuffle_patch"; then
                        git apply "$shuffle_patch"
                      else
                        die 'IR3 shuffle optimization incompatible with source'
                      fi
          ''')
          sub('[ "$count" -eq 6 ]', '[ "$count" -eq 5 ]')
          sub('pretty_name="Turnip A8xx Patched Patchs1"', 'pretty_name="Turnip Gen39 A840 Performance"')
          sub('suffix="A8xx-Patched-Patchs1"', 'suffix="Gen39-A840-Performance"')
          start=s.index('            if ! git apply --check "$poll_patch"; then')
          end=s.index('            ;;',start)
          s=s[:start]+'''            if grep -Fq 'return kgsl_poll_timestamp(device, context_id, timestamp);' src/freedreno/vulkan/tu_knl_kgsl.cc; then
                          log 'KGSL upstream nonblocking zero-timeout fix present'
                      elif git apply --check "$poll_patch"; then
                          git apply "$poll_patch"
                      else
                          die 'KGSL nonblocking poll unavailable'
                      fi
          '''+s[end:]
          # Port Mesa df911094 (merged 2026-11-12): bit 32 was truncated
          # by kgsl_gpumem_alloc_id.flags (32 bits). This is a real upstream bug.
          sub('    configure_variant\n    apply_android_ndk_fixes', '''    configure_variant
              if ! grep -Fq 'if (kgsl_flags >> 32)' src/freedreno/vulkan/tu_knl_kgsl.cc; then
                  log 'Backporting Mesa df911094: preserve KGSL_MEMFLAGS_FORCE_32BIT'
                  git fetch -q --depth=2 origin df911094d362179661f96d0f19e29a9f79cf252a
                  git show --format= df911094d362179661f96d0f19e29a9f79cf252a -- src/freedreno/vulkan/tu_knl_kgsl.cc > "$WORKDIR/force32.patch"
                  [ -s "$WORKDIR/force32.patch" ] || die 'Missing pinned upstream KGSL patch'
                  if git apply --check "$WORKDIR/force32.patch"; then
                      git apply "$WORKDIR/force32.patch"
                  else
                      die 'Upstream force32 patch does not apply cleanly to this Mesa/variant'
                  fi
              fi
              grep -Fq 'if (kgsl_flags >> 32)' src/freedreno/vulkan/tu_knl_kgsl.cc || die 'KGSL fix missing after patch'
              grep -Fq 'IOCTL_KGSL_GPUOBJ_INFO' src/freedreno/vulkan/tu_knl_kgsl.cc || die 'KGSL GPU VA query missing'
              apply_android_ndk_fixes''')
          f.write_text(s)
          PY
          bash -n turnip-recipe/build_turnip.sh
          test "$(find turnip-recipe/patches/patchs1 -maxdepth 1 -name '0006-*.patch' | wc -l)" -eq 0
          grep -Fq 'make_shuffle_mixed(' turnip-recipe/patches/spiderman2/shuffle.patch
      - name: Build Gen39 patched performance
        env:
          VARIANT: a8xx-patchs1
          MESA_COMMIT: f28352d1179a4a85b4be286a883747bae2d3786b
          BUILD_VERSION: 39-spiderman2-kgsl-force32-r1
        run: |
          cd turnip-recipe
          bash build_turnip.sh
      - name: Verify ARM64 driver ZIP
        run: |
          set -euo pipefail
          zip_path="$(find turnip-recipe/turnip_workdir -maxdepth 1 -name 'Turnip_Gen39-A840-Performance_*.zip' -type f -print -quit)"
          test -n "$zip_path"
          unzip -t "$zip_path"
          unzip -p "$zip_path" meta.json | python3 -m json.tool
          unzip -p "$zip_path" libvulkan_freedreno.so >/tmp/v39.so
          readelf -h /tmp/v39.so | grep -q AArch64
          sha256sum "$zip_path" > turnip-recipe/turnip_workdir/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Turnip-Gen39-A840-SpiderMan2-KGSL-FORCE32
          path: |
            turnip-recipe/turnip_workdir/Turnip_Gen39-A840-Performance_*.zip
            turnip-recipe/turnip_workdir/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish the actual AdrenoTools ZIP directly in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gen39-a840-spiderman2-kgsl-force32-r1
          target_commitish: ${{ github.sha }}
          name: Turnip Gen39 A840 Spider-Man 2 KGSL FORCE_32BIT r1
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Download the Turnip_Gen39-A840-Performance_*.zip asset directly.
            This is the AdrenoTools driver ZIP (root contains meta.json and libvulkan_freedreno.so).
            Do not import the GitHub Actions artifact wrapper into Winlator.
            Backports Mesa df911094 (2026-11-12): fixes truncated bit-32 KGSL FORCE_32BIT allocation flag. Experimental, no claim that Spider-Man 2 crash or Feature Level 12_0 is fixed.
          files: turnip-recipe/turnip_workdir/Turnip_Gen39-A840-Performance_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
