name: shadPS4 0.18.1 real source port onto working ARM64/FEX foundation
on:
  workflow_dispatch:
  push:
    branches:
      - feature/bionic-shadps4-0181-source-port-20261121
    paths:
      - '.github/workflows/bachata-bionic-0181-source-rebase.yml'
      - 'bionic/source0181/**'
permissions:
  contents: read
jobs:
  source-rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fetch full working shadPS4 FEX ARM64 base and real upstream 0.18.1
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/zenithblue-oss/shadps4-arm64.git source-0181
          git -C source-0181 checkout --quiet be6bc2e9c60799e071dd2fafa6216e8d80ec619c
          git -C source-0181 config user.name 'Bachata Source Port CI'
          git -C source-0181 config user.email 'source-port@users.noreply.github.com'
          git -C source-0181 remote add shadps4 https://github.com/shadps4-emu/shadPS4.git
          git -C source-0181 fetch --quiet --filter=blob:none shadps4 3912336fdfffbd5c99b59d92e997ea6ebd62216c
          git -C source-0181 show HEAD:CMakeLists.txt | grep -F 'set(EMULATOR_VERSION_MINOR "16")'
          git -C source-0181 show FETCH_HEAD:CMakeLists.txt | grep -F 'set(EMULATOR_VERSION_MINOR "18")'
      - name: Integrate real upstream 0.18.1 shader/GPU with working FEX Android host
        run: |
          set -euo pipefail
          python3 -m py_compile bionic/source0181/rebase_arm64.py
          python3 bionic/source0181/rebase_arm64.py --source source-0181 --output out/source0181
          grep -Fq 'set(EMULATOR_VERSION_MINOR "18")' source-0181/CMakeLists.txt
          grep -Fq 'set(EMULATOR_VERSION_PATCH "1")' source-0181/CMakeLists.txt
          test -s source-0181/src/core/fex/fex_guest_engine.cpp
          test -s source-0181/src/core/guest_cpu/fex_guest_cpu.cpp
          test -s source-0181/src/platform/bachata/runtime_client.cpp
          echo 'REAL_0181_PS4_GPU_SOURCE_WITH_FEX_ANDROID_PLATFORM' >> "$GITHUB_STEP_SUMMARY"

      - name: Reintegrate actual Bionic JNI, FEX HLE and SAF into merged 0.18.1
        run: |
          set -euo pipefail
          python3 -m py_compile bionic/generic/port_generic.py
          if python3 bionic/generic/port_generic.py source-0181 >out/source0181/android-port.log 2>&1; then
            echo 'SHADPS4_0181_ANDROID_BIONIC_PLATFORM_OVERLAY_APPLIED'
            cat out/source0181/android-port.log | tail -45
          else
            echo '::error::0.18.1 source requires more port adaptation; build blocked until resolved'
            tail -90 out/source0181/android-port.log
            exit 2
          fi
          git -C source-0181 diff --check
          grep -Fq 'BachataCoreMain' source-0181/src/main.cpp
          grep -Fq 'BachataSaf::Configure' source-0181/src/main.cpp
          grep -Fq 'JNIEXPORT jint JNICALL' bionic/generic/android_native_core.cpp
          grep -Fq 'BIONIC_VULKAN_CUSTOM_BRIDGE_READY' source-0181/src/video_core/renderer_vulkan/vk_platform.cpp
          echo 'SHADPS4_0181_FULL_BIONIC_SOURCE_PORT_APPLIED' >> "$GITHUB_STEP_SUMMARY"
      - name: Save source provenance and conflict report before any candidate build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadPS4-0181-ARM64-FEX-source-rebase-report
          path: out/source0181/
          retention-days: 14
          if-no-files-found: error
