name: tmp save-manager donor fetch
on:
  push:
    paths:
      - '.github/workflows/tmp-save-manager-base-fetch.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download donor Bachata S4 0.2.4
        run: |
          curl -L --fail --retry 3             -o bachatas4-0.2.4-release.apk             https://github.com/JICA98/Bachata-S4/releases/download/v0.2.4/bachatas4-0.2.4-release.apk
          echo "4077b0d0b80e354c71eff1ce2c003f122449ac266eb27a6ac26744d3f9809a08  bachatas4-0.2.4-release.apk" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: bachata-s4-024-donor
          path: bachatas4-0.2.4-release.apk
          retention-days: 1
