name: Compile R27 FSR Android controls and loader (no core build)
on:
  push:
    branches: [feature/r27-fsr31-existing025]
    paths:
      - 'tools/fsr31-026/Fsr3Ui.java'
      - 'tools/fsr31-026/Fsr3Resolution.java'
      - 'tools/fsr31-026/bionic_loader_stage.c'
      - '.github/workflows/fsr31-r27-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile Android controls and tiny Bionic preload stage
        shell: bash
        run: |
          set -euxo pipefail
          PLATFORM=$(find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -name 'android-*' | sort -V | tail -1)
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          NDK=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p out/classes out/dex out/lib
          javac -source 8 -target 8 -classpath "$PLATFORM/android.jar" -d out/classes tools/fsr31-026/Fsr3Ui.java tools/fsr31-026/Fsr3Resolution.java
          "$BUILD_TOOLS/d8" --min-api 26 --lib "$PLATFORM/android.jar" --output out/dex $(find out/classes -name '*.class')
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" -Oz -fPIC -shared -Wl,-z,max-page-size=16384 -Wl,-soname,libbachata_fsr31_stage.so tools/fsr31-026/bionic_loader_stage.c -o out/lib/libbachata_fsr31_stage.so
          readelf -l out/lib/libbachata_fsr31_stage.so
          readelf -d out/lib/libbachata_fsr31_stage.so
          sha256sum out/dex/classes.dex out/lib/libbachata_fsr31_stage.so > out/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: R27-FSR-Android-controls-and-loader
          path: out/
          if-no-files-found: error
          retention-days: 7
