name: V20H GOW3 Sync/ZPASS Isolation ARM64/FEX

on:
  workflow_dispatch:
  push:
    branches: [codex/gow3-v20-build]
    paths:
      - .github/workflows/v20h-sync-isolation.yml
      - runtime/v20h/**

permissions:
  contents: read

concurrency:
  group: gow3-v20h-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-v20h:
    strategy:
      fail-fast: false
      matrix:
        variant: [zpass-failopen, legacy-pixelstats]
    name: build-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout V20H control files
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout hardened buildable ARM64/FEX source
        uses: actions/checkout@v4
        with:
          repository: zenithblue-oss/shadps4-arm64
          ref: be6bc2e9c60799e071dd2fafa6216e8d80ec619c
          fetch-depth: 0
          submodules: false
          path: source

      - name: Self-heal and hydrate submodules
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail

          hydrate_repo() {
            local root="$1"
            local depth="$2"
            (( depth > 5 )) && return 0
            [[ -f "$root/.gitmodules" ]] || return 0

            while read -r key path; do
              local name="${key#submodule.}"
              name="${name%.path}"
              local url branch target
              url="$(git -C "$root" config -f .gitmodules --get "submodule.$name.url" || true)"
              branch="$(git -C "$root" config -f .gitmodules --get "submodule.$name.branch" || true)"
              target="$root/$path"
              [[ -n "$url" ]] || continue

              git -C "$root" -c submodule.recurse=false submodule sync -- "$path" || true
              if ! git -C "$root" -c submodule.recurse=false submodule update --init --depth 1 -- "$path"; then
                rm -rf "$target"
                if [[ -n "$branch" ]]; then
                  git clone --depth 1 --branch "$branch" "$url" "$target" || git clone --depth 1 "$url" "$target"
                else
                  git clone --depth 1 "$url" "$target"
                fi
              fi
              [[ -d "$target" ]] && hydrate_repo "$target" "$((depth + 1))" || true
            done < <(
              git -C "$root" config -f .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null || true
            )
          }

          hydrate_repo "." 0

      - name: Apply V20H sync isolation + real predication
        shell: bash
        working-directory: source
        env:
          V20H_VARIANT: ${{ matrix.variant }}
        run: |
          bash ../control/runtime/v20h/apply-sync-isolation.sh
          git diff --cached --stat

      - name: Build V20H AArch64/FEX
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/source:/workspace" \
            -w /workspace \
            -e BACHATA_INSIDE_DEBIAN_CONTAINER=1 \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              bash runtime/scripts/install-debian-runtime-deps.sh
              git config --global --add safe.directory "*"
              bash runtime/scripts/build-shadps4-arm64.sh
            '

      - name: Locate verify and fingerprint compiled FEX core
        shell: bash
        env:
          V20H_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          cd source
          CORE=runtime/build/shadps4-arm64-stage/bin/shadps4-arm64
          test -s "$CORE"
          file "$CORE"
          HEADER="$(readelf -h "$CORE")"
          grep -Eq 'Class:[[:space:]]+ELF64' <<< "$HEADER"
          grep -Eq 'Machine:[[:space:]]+AArch64' <<< "$HEADER"

          cp "$CORE" "$GITHUB_WORKSPACE/shadps4-arm64-fex"
          cp runtime/build/shadps4-arm64-stage/needed.txt "$GITHUB_WORKSPACE/V20H-needed.txt"
          sha256sum "$GITHUB_WORKSPACE/shadps4-arm64-fex" | tee "$GITHUB_WORKSPACE/V20H-shadps4-arm64-fex.sha256"

          {
            echo "variant=$V20H_VARIANT"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "control_commit=${{ github.sha }}"
            echo "predication_upstream=3559530df5aec4067a95912af13ef14896b65ada"
            readelf -n "$CORE" | grep -m1 'Build ID:' || true
            echo '--- key symbols ---'
            nm -S -C "$CORE" | grep -E 'PredicationManager::(DumpZpassCounters|EnableFromZpass)|Liverpool::ProcessGraphics|Presenter::PrepareFrame|VideoOutDriver::SubmitFlipInternal' || true
          } > "$GITHUB_WORKSPACE/V20H-build-info.txt"

      - name: Upload V20H compiled core
        uses: actions/upload-artifact@v7
        with:
          name: GOW3-V20H-${{ matrix.variant }}-shadps4-arm64-fex
          path: |
            shadps4-arm64-fex
            V20H-shadps4-arm64-fex.sha256
            V20H-needed.txt
            V20H-build-info.txt
          if-no-files-found: error
          retention-days: 7
