name: Verify source-level ARM64 rasterizer integration
on:
  push:
    branches: [feature/fsr31-026-port-rasterizer]
    paths:
      - 'tools/fsr31-026/port_apply_source.py'
      - 'tools/fsr31-026/port_*.h'
      - 'tools/fsr31-026/test_port_*.cpp'
      - 'tools/fsr31-026/port_camera_motion.comp'
      - '.github/workflows/fsr31-026-port-source-audit.yml'
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get real Bachata ARM64 renderer source
        run: git clone --depth=1 https://github.com/zenithblue-oss/shadps4-arm64.git /tmp/arm64-source
      - name: Verify port state hooks apply to actual guest shader rasterizer
        run: |
          set -euo pipefail
          python3 tools/fsr31-026/port_apply_source.py /tmp/arm64-source
          git -C /tmp/arm64-source diff --check
          grep -Fq 'fsr31PortCamera.OnConstants(' /tmp/arm64-source/src/video_core/renderer_vulkan/vk_rasterizer.cpp
          grep -Fq 'fsr31PortStage.Observe(d)' /tmp/arm64-source/src/video_core/renderer_vulkan/vk_rasterizer.cpp
          grep -Fq 'void Rasterizer::Fsr31PortOnPresentedFrame()' /tmp/arm64-source/src/video_core/renderer_vulkan/vk_rasterizer.cpp
          grep -Fq 'rasterizer->Fsr31PortOnPresentedFrame();' /tmp/arm64-source/src/video_core/renderer_vulkan/vk_presenter.cpp
          ! grep -q 'if (event == Bachata::Fsr31::Event::BeginHUD)' /tmp/arm64-source/src/video_core/renderer_vulkan/vk_rasterizer.cpp
          grep -Fq 'port_camera_state.h' /tmp/arm64-source/src/video_core/renderer_vulkan/vk_rasterizer.h
          grep -Fq 'port_rasterizer_scene.h' /tmp/arm64-source/src/video_core/renderer_vulkan/vk_rasterizer.h
          ! grep -Eq 'first_pre_ui_color|vkCmdBlitImage|capture_active' /tmp/arm64-source/src/video_core/renderer_vulkan/port_rasterizer_scene.h
          echo 'Port stage instrumentation inserted with no framebuffer modifications'
      - name: Compile guest classifier and camera predicates
        run: |
          set -euo pipefail
          cd tools/fsr31-026
          g++ -std=c++20 -O2 -Wall -Wextra -Werror test_port_rasterizer_scene.cpp -o /tmp/test-scene
          g++ -std=c++20 -O2 -Wall -Wextra -Werror test_port_camera_state.cpp -o /tmp/test-camera
          g++ -std=c++20 -O2 -Wall -Wextra -Werror test_port_camera_motion_math.cpp -o /tmp/test-motion
          /tmp/test-scene && /tmp/test-camera && /tmp/test-motion
      - name: Compile real Bloodborne camera-motion shader into SPIR-V
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          glslangValidator -V -S comp tools/fsr31-026/port_camera_motion.comp -o /tmp/bachata-camera-motion.spv
          test "$(stat -c%s /tmp/bachata-camera-motion.spv)" -gt 512
