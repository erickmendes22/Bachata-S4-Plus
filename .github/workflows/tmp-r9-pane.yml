name: tmp R9 pane
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tmp-r9-pane.yml'
      - '.github/tmp_r9/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile pane dex
        run: |
          set -eux
          curl -L -o kotlin-stdlib.jar 'https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.1.20/kotlin-stdlib-2.1.20.jar'
          mkdir -p stubsrc/androidx/compose/runtime stubsrc/androidx/compose/ui/viewinterop stubsrc/androidx/compose/ui build out
          cat > stubsrc/androidx/compose/runtime/Composer.java <<'EOF'
          package androidx.compose.runtime; public interface Composer {}
          EOF
          cat > stubsrc/androidx/compose/ui/Modifier.java <<'EOF'
          package androidx.compose.ui; public interface Modifier {}
          EOF
          cat > stubsrc/androidx/compose/ui/viewinterop/AndroidView_androidKt.java <<'EOF'
          package androidx.compose.ui.viewinterop; import android.content.Context; import android.view.View; import androidx.compose.runtime.Composer; import androidx.compose.ui.Modifier; import kotlin.jvm.functions.Function1;
          public final class AndroidView_androidKt { public static void AndroidView(Function1<? super Context, ? extends View> factory, Modifier modifier, Function1<? super View, kotlin.Unit> update, Composer composer, int changed, int defaults){} }
          EOF
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          javac -source 8 -target 8 -cp "$ANDROID_JAR:kotlin-stdlib.jar" -d build $(find stubsrc -name '*.java') .github/tmp_r9/ExternalStoragePane.java
          D8=$(find "$ANDROID_HOME/build-tools" -type f -name d8 | sort -V | tail -1)
          "$D8" --min-api 26 --lib "$ANDROID_JAR" --classpath kotlin-stdlib.jar --output out $(find build/com/bachatas4/android/bridge -name '*.class')
          mv out/classes.dex classes10.dex
          strings classes10.dex | grep -E 'ExternalStoragePane|PKG extraction location|Choose folder|Use app storage'
      - uses: actions/upload-artifact@v4
        with:
          name: r9-pane-dex
          path: classes10.dex
