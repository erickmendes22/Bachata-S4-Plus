name: Build Android GLIBC FSR3 SDK for existing core 025
on:
  push:
    branches: [feature/fsr31-026-existing-core, feature/fsr31-026-r13-pre-ui, feature/fsr31-port-runscaled-024, feature/fsr31-port-runscaled-024-validated-scene, feature/fsr31-core025-scene-transaction, feature/fsr31-core025-r18-native-gbuffer-viewport]
    paths:
      - 'tools/fsr31-026/**'
      - 'tools/fsr31-025/**'
      - '.github/workflows/fsr31-026-build.yml'
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify reference scene and UI resolution patch profiles
        run: python3 tools/fsr31-025/test_port_resolution_patch.py
      - name: Configure Ubuntu for ARM64 cross-build
        run: |
          set -euxo pipefail
          sudo dpkg --add-architecture arm64
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main restricted universe multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main restricted universe multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo tee /etc/apt/sources.list.d/arm64.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git cmake ninja-build python3-mako python3-setuptools python3-unicorn pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libvulkan-dev:arm64 libvulkan-dev:amd64 mesa-vulkan-drivers vulkan-validationlayers:amd64 libvulkan1:arm64 libx11-dev:arm64 glslang-tools \
            libstdc++6:arm64
      - name: Execute the guest width and height hook contract
        run: python3 tools/fsr31-025/test_decoupled_resolution_hook.py
      - name: Check out exact portable FSR implementation from Android Bloodborne port
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/FireBurn/FSR-Vulkan.git fsr-vulkan
          git -C fsr-vulkan checkout --detach c64f093404125e960813f95f1996c14780f0dd69
          for name in 0002-Vulkan-backend-device-local-memory-on-unified-memory-GPUs.patch 0003-Frame-generation-free-per-frame-descriptor-pools-and-constant-buffers.patch; do
            curl -fLsS "https://raw.githubusercontent.com/ducvd89/Bloodborne-Android/android-0.5.2/gpu/patches/fsr-vulkan/$name" -o "/tmp/$name"
            git -C fsr-vulkan apply --check "/tmp/$name"
            git -C fsr-vulkan apply "/tmp/$name"
          done
      - name: Build FSR 3.1 ARM64 glibc SDK as independently loadable shared library
        run: |
          set -euxo pipefail
          cat > fsr-aarch64.ini <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_FIND_ROOT_PATH /usr/aarch64-linux-gnu /usr)
          EOF
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(bs4_fsr3 LANGUAGES C CXX)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)
          set(CMAKE_CXX_STANDARD 17)
          set(FFX_VK_PORTABLE_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(FFX_VK_PORTABLE_BUILD_PROBE OFF CACHE BOOL "" FORCE)
          set(FFX_VK_PORTABLE_BUILD_FSR3_HOST ON CACHE BOOL "" FORCE)
          set(FFX_VK_PORTABLE_BUILD_FSR3_VK_BACKEND ON CACHE BOOL "" FORCE)
          set(FFX_VK_PORTABLE_BUILD_FSR3_3_1_5_SCAFFOLD OFF CACHE BOOL "" FORCE)
          set(FFX_VK_PORTABLE_BUILD_FSR4_V07_VULKAN OFF CACHE BOOL "" FORCE)
          set(FFX_VK_PORTABLE_INSTALL OFF CACHE BOOL "" FORCE)
          add_subdirectory(fsr-vulkan)
          find_package(Vulkan REQUIRED)
          add_library(bachata_fsr31 SHARED
            tools/fsr31-026/bridge.cpp
            tools/fsr31-026/vulkan_capture.cpp
            tools/fsr31-026/port_camera_probe.cpp
            tools/fsr31-026/port_ui_redirect.cpp
            tools/fsr31-026/temporal_generic.cpp)
          target_compile_features(bachata_fsr31 PRIVATE cxx_std_17)
          target_include_directories(bachata_fsr31 PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/generated")
          target_compile_definitions(bachata_fsr31 PRIVATE _GNU_SOURCE=1)
          target_link_libraries(bachata_fsr31 PRIVATE ffx-vulkan::portable Vulkan::Vulkan)
          set_target_properties(bachata_fsr31 PROPERTIES OUTPUT_NAME bachata_fsr31)
          EOF
          mkdir -p generated
          glslangValidator -V --target-env vulkan1.2 -S comp -o /tmp/flow.spv tools/fsr31-026/flow.comp
          # Compile the unchanged motion reprojection shader from the *real*
          # Bloodborne Android Port (not another guessed optical-flow shader).
          glslangValidator -V --target-env vulkan1.2 -S comp \
            -o /tmp/port_camera_motion.spv tools/fsr31-026/port_camera_motion.comp
          test -s /tmp/port_camera_motion.spv
          if command -v spirv-val >/dev/null; then
            spirv-val --target-env vulkan1.2 /tmp/port_camera_motion.spv
          fi
          python3 - <<'PY'
          from pathlib import Path
          import struct
          raw=Path('/tmp/flow.spv').read_bytes()
          assert len(raw)%4==0 and raw[:4] == bytes.fromhex('03022307')
          words=struct.unpack('<%dI'%(len(raw)//4),raw)
          content='#pragma once\n#include <stdint.h>\nstatic const uint32_t BS4_FSR31_FLOW_SPV[] = {\n'
          for i in range(0,len(words),8):
              content += '    '+', '.join('0x%08x'%v for v in words[i:i+8])+',\n'
          content+='};\n'
          Path('generated/flow_spv.h').write_text(content)
          print('Optical flow shader bytes:',len(raw))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import struct
          raw=Path('/tmp/port_camera_motion.spv').read_bytes()
          assert len(raw)%4==0 and raw[:4]==bytes.fromhex('03022307')
          words=struct.unpack('<%dI'%(len(raw)//4),raw)
          h='#pragma once\n#include <cstdint>\n'
          h+='constexpr uint32_t BS4_PORT_CAMERA_MOTION_SPV[] = {\n'
          for i in range(0,len(words),8):
              h+='    '+', '.join('0x%08x'%v for v in words[i:i+8])+',\n'
          h+='};\n'
          Path('generated/port_camera_motion_spv.h').write_text(h)
          print('Port depth reprojection shader bytes:',len(raw))
          PY
          # Reject invalid scene-camera buffers before cross-compilation.
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Itools/fsr31-026 tools/fsr31-026/port_camera_constants_test.cpp \
            -o /tmp/port_camera_contract_test
          /tmp/port_camera_contract_test
          cmake -S . -B build -GNinja -DCMAKE_TOOLCHAIN_FILE=fsr-aarch64.ini -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target bachata_fsr31 -j 6
      - name: Execute scene crop and UI transaction tests on software Vulkan
        run: |
          set -euxo pipefail
          cmake -S tools/fsr31-025 -B build-host -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DBS4_FSR_SDK_DIR="$PWD/fsr-vulkan" \
            -DBS4_GENERATED_DIR="$PWD/generated" \
            -DVulkan_LIBRARY=/usr/lib/x86_64-linux-gnu/libvulkan.so
          cmake --build build-host --target bachata_fsr31 -j 6
          g++ -std=c++17 -O2 -I/usr/include tools/fsr31-025/ui_transaction_test.cpp \
            -lvulkan -o /tmp/ui_transaction_test
          /tmp/ui_transaction_test | tee ui-tests.txt
          g++ -std=c++17 -O2 tools/fsr31-025/render_area_bounds_test.cpp -o /tmp/render_area_bounds_test
          /tmp/render_area_bounds_test | tee -a ui-tests.txt
          g++ -std=c++17 -O2 tools/fsr31-025/camera_entrypoint_test.cpp -ldl -o /tmp/camera_entrypoint_test
          /tmp/camera_entrypoint_test | tee camera-entrypoint-tests.txt
          g++ -std=c++17 -O2 -Ifsr-vulkan -Ifsr-vulkan/include \
            tools/fsr31-025/scene_gpu_test.cpp -Lbuild-host -lbachata_fsr31 \
            -lvulkan -Wl,-rpath,"$PWD/build-host" -o /tmp/shadps4-arm64-025
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name '*lvp*.json' | head -n1)"
          test -n "$VK_ICD_FILENAMES"
          /tmp/shadps4-arm64-025 | tee scene-tests.txt
          glslangValidator -V --target-env vulkan1.2 -S vert -o /tmp/ui.vert.spv tools/fsr31-025/integration_ui.vert
          glslangValidator -V --target-env vulkan1.2 -S frag -o /tmp/ui.frag.spv tools/fsr31-025/integration_ui.frag
          glslangValidator -V --target-env vulkan1.2 -S frag -o /tmp/post.frag.spv tools/fsr31-025/integration_post.frag
          g++ -std=c++17 -O2 -Ifsr-vulkan -Ifsr-vulkan/include \
            tools/fsr31-025/runscaled_integration_gpu_test.cpp -Lbuild-host -lbachata_fsr31 \
            -lvulkan -Wl,-rpath,"$PWD/build-host" -o /tmp/shadps4-arm64-025
          /tmp/shadps4-arm64-025 /tmp/ui.vert.spv /tmp/ui.frag.spv /tmp/post.frag.spv | tee integration-tests.txt
          /tmp/shadps4-arm64-025 /tmp/ui.vert.spv /tmp/ui.frag.spv /tmp/post.frag.spv --scene-sized | tee -a integration-tests.txt
          /tmp/shadps4-arm64-025 /tmp/ui.vert.spv /tmp/ui.frag.spv /tmp/post.frag.spv --scene-sized --oversized-area | tee -a integration-tests.txt
          # Negative control: execute the identical new device-shaped test
          # against the capture implementation actually shipped in R23.
          curl -fLsS https://raw.githubusercontent.com/erickmendes22/Bachata-S4-Plus/4a12e8e3d383d16318060a2cd2e404405642a70c/tools/fsr31-026/vulkan_capture.cpp -o /tmp/r23-capture.cpp
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source=Path('tools/fsr31-026/vulkan_capture.cpp')
          current=source.read_bytes()
          try:
              source.write_bytes(Path('/tmp/r23-capture.cpp').read_bytes())
              subprocess.run(['cmake','--build','build-host','--target','bachata_fsr31','-j','6'],check=True)
              result=subprocess.run(['/tmp/shadps4-arm64-025','/tmp/ui.vert.spv','/tmp/ui.frag.spv','/tmp/post.frag.spv','--scene-sized','--oversized-area'],capture_output=True,text=True)
              Path('render-bounds-regression.txt').write_text(result.stdout+result.stderr)
              assert result.returncode!=0, 'R23 baseline unexpectedly accepted invalid attachment bounds'
              assert 'BOUNDS_VALIDATION_ERROR' in result.stderr, 'Baseline failed for an unrelated reason'
              print('PASS: R23 baseline reproduces Vulkan attachment bounds errors; repaired live-hook path passes the identical test')
          finally:
              source.write_bytes(current)
              subprocess.run(['cmake','--build','build-host','--target','bachata_fsr31','-j','6'],check=True)
          PY

      - name: Test R16 core025-only GLIBC FSR preloader
        run: |
          set -euxo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            tools/fsr31-025/dispatch_preload.c \
            tools/fsr31-025/dispatch_preload_test.c \
            -o /tmp/dispatch_preload_test
          /tmp/dispatch_preload_test
          aarch64-linux-gnu-gcc -std=c11 -O2 -ffreestanding \
            -fno-builtin -fno-stack-protector -fno-asynchronous-unwind-tables \
            -c tools/fsr31-025/dispatch_preload.c -o /tmp/r16_loader_c.o
          aarch64-linux-gnu-gcc -c tools/fsr31-025/dispatch_preload.S \
            -o /tmp/r16_loader_entry.o
          aarch64-linux-gnu-ld -T tools/fsr31-025/dispatch_preload.ld \
            /tmp/r16_loader_entry.o /tmp/r16_loader_c.o -o /tmp/r16_loader.elf
          aarch64-linux-gnu-objcopy -O binary -j .entry \
            /tmp/r16_loader.elf /tmp/r16_loader.bin
          test $(wc -c < /tmp/r16_loader.bin) -lt 1536
          ! readelf -r /tmp/r16_loader.elf | grep -E 'R_AARCH64_'
          aarch64-linux-gnu-objdump -d /tmp/r16_loader.elf \
            | grep -q 'bs4_r16_insert_preload'
          echo 'PASS: core025 GLIBC preload trampoline linked; no unresolved relocation'
      - name: Validate ARM64 and exports
        run: |
          set -euxo pipefail
          test -s build/libbachata_fsr31.so
          file build/libbachata_fsr31.so | grep -Ei 'aarch64|ARM aarch64'
          readelf -d build/libbachata_fsr31.so | tee needed.txt
          readelf -Ws build/libbachata_fsr31.so | grep bs4_fsr31_ | tee symbols.txt
          nm -D build/libbachata_fsr31.so | grep bs4_fsr31_record
          sha256sum build/libbachata_fsr31.so | tee sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BS4-CORE025-RUNSCALED-SDK
          path: |
            build/libbachata_fsr31.so
            sha256.txt
            needed.txt
            symbols.txt
            integration-tests.txt
            camera-entrypoint-tests.txt
            ui-tests.txt
            scene-tests.txt
          if-no-files-found: error
          retention-days: 7
