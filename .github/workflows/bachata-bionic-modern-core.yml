name: Bachata Bionic shadPS4 0.21.1 native build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bionic-shadps4-0211-20261121
    paths:
      - 'bionic/modern/**'
      - '.github/workflows/bachata-bionic-modern-core.yml'

permissions:
  contents: read

concurrency:
  group: bachata-bionic-modern-source-${{ github.ref }}
  cancel-in-progress: true

env:
  MODERN_PORT_REPO: zgj3880888/shadps4-arm64-021
  MODERN_PORT_REF: 0e713b0d6a7e92ce50c7b011e804b41b235f39bd
  MODERN_ARM64_BASE: https://github.com/Nyces/shadps4-arm64.git
  MODERN_BASE_REF: 3d4ff9a9b112cdbec7458b85c76c14db1047f161

jobs:
  source-rebase:
    name: Verify shadPS4 0.21.1 + FEX/SAF source and audit Android compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout current Bachata Bionic implementation
        uses: actions/checkout@v4

      - name: Fetch pinned ARM64 port base (no submodules)
        run: |
          set -euo pipefail
          git init -q modern-core
          git -C modern-core remote add origin "$MODERN_ARM64_BASE"
          git -C modern-core fetch --no-tags --depth 1 origin "$MODERN_BASE_REF" ||
            git -C modern-core fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git -C modern-core checkout --detach "$MODERN_BASE_REF"

      - name: Apply tested upstream 0.21.1 ARM64 port without pulling 48 submodules
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${MODERN_PORT_REPO}/${MODERN_PORT_REF}"
          curl --fail --location --retry 3 --silent --show-error \
            "${base}/patches/0001-upstream-021-arm64-port.patch" -o /tmp/shadps4-0211-arm64.patch
          curl --fail --location --retry 3 --silent --show-error \
            "${base}/config/submodule-shas.txt" -o /tmp/shadps4-0211-modules.txt
          test "$(wc -c </tmp/shadps4-0211-arm64.patch)" -gt 1000000
          exclusions=(--exclude=.gitmodules)
          while read -r path rev; do
            [[ -n "$path" ]] || continue
            exclusions+=("--exclude=$path")
          done < /tmp/shadps4-0211-modules.txt
          git -C modern-core apply --check --binary "${exclusions[@]}" /tmp/shadps4-0211-arm64.patch
          git -C modern-core apply --binary "${exclusions[@]}" /tmp/shadps4-0211-arm64.patch
          # The published 0.21.1 port contains whitespace-only warnings
          # in unrelated upstream tests. Record them without confusing them
          # with failed patch application or an ABI incompatibility.
          git -C modern-core diff --check > /tmp/modern-port-whitespace.txt 2>&1 || true
          echo "PORT_WHITESPACE_DIAGNOSTIC_LINES=$(wc -l </tmp/modern-port-whitespace.txt)"
          printf 'SHADPS4_0211_REBASE_APPLIES_CLEANLY\n'

      - name: Integrate original AdrenoTools Vulkan selection on modern source
        run: |
          set -euo pipefail
          python3 -m py_compile bionic/modern/port_android_vulkan.py
          python3 bionic/modern/port_android_vulkan.py --source modern-core
          grep -Fq 'BIONIC_021_VULKAN_CUSTOM_READY' modern-core/src/video_core/renderer_vulkan/vk_platform.cpp
          grep -Fq 'bachata_open_custom_vulkan' modern-core/src/video_core/renderer_vulkan/vk_platform.cpp

      - name: Port Android WSI and native JNI entry into full modern core
        run: |
          set -euo pipefail
          python3 -m py_compile bionic/modern/port_android_wsi.py bionic/modern/port_android_entry.py
          python3 bionic/modern/port_android_wsi.py --source modern-core
          python3 bionic/modern/port_android_entry.py --source modern-core --overlay bionic/generic
          grep -Fq 'BIONIC_021_ANDROID_SURFACE_READY' modern-core/src/video_core/renderer_vulkan/vk_platform.cpp
          grep -Fq '#if defined(__ANDROID__) || defined(ANDROID)' modern-core/src/video_core/renderer_vulkan/vk_platform.cpp
          grep -Fq 'target_compile_definitions(shadps4 PRIVATE ANDROID=1)' modern-core/CMakeLists.txt
          grep -Fq 'Java_com_bachatas4_android_runtime_process_NativeRuntimeBridge_run' bionic/generic/android_native_core.cpp
          grep -Fq 'OUTPUT_NAME "bachata_bionic_core"' modern-core/CMakeLists.txt
          grep -Fq 'BIONIC_021_RETURN_FROM_EMULATOR' modern-core/src/emulator.cpp

      - name: Connect BSF1 SAF broker to all 0.21.1 IBackend VFS operations
        run: |
          set -euo pipefail
          python3 -m py_compile bionic/modern/port_android_saf.py
          python3 bionic/modern/port_android_saf.py --source modern-core --overlay bionic/modern
          grep -Fq 'BIONIC_021_SAF_VFS_MOUNT_READY' modern-core/src/core/file_sys/fs.cpp
          grep -Fq 'backends.push_back(std::make_shared<SafStackBackend>' modern-core/src/core/file_sys/fs.cpp
          grep -Fq 'BIONIC_021_SAF_BROKER_METADATA' modern-core/src/core/file_sys/saf_fs_backend.cpp
          grep -Fq 'BIONIC_021_SAF_MERGED_DIRECTORY' modern-core/src/core/file_sys/saf_fs_backend.cpp
          grep -Fq 'BIONIC_021_SAF_EBOOT_RESOLVED' modern-core/src/emulator.cpp
          echo 'BIONIC_021_SAF_IBackend_ALL_PATHS_INTEGRATED'

      - name: Restore early FEX libc aliases and AvPlayer HLE before game import resolution
        run: |
          set -euo pipefail
          python3 -m py_compile bionic/modern/port_android_fex_hle.py
          python3 bionic/modern/port_android_fex_hle.py --source modern-core
          grep -Fq BIONIC_021_FEX_EARLY_AVPLAYER_HLE modern-core/src/core/libraries/libs.cpp
          grep -Fq BIONIC_021_FEX_LIBC_ALIASES modern-core/src/core/libraries/libs.cpp
          echo BIONIC_021_FEX_BOOT_HLE_PATCH_APPLIED

      - name: Reinstate original ARM64 FEX guest thread and callback dispatch lost in 0.21.1 patch
        run: |
          set -euo pipefail
          python3 -m py_compile bionic/modern/port_android_fex_threads.py
          python3 bionic/modern/port_android_fex_threads.py --source modern-core
          grep -Fq 'BIONIC_021_FEX_PTHREAD_GUEST_ENTRY' modern-core/src/core/libraries/kernel/threads/pthread.cpp
          grep -Fq 'BIONIC_021_FEX_PTHREAD_ONCE' modern-core/src/core/libraries/kernel/threads/pthread.cpp
          grep -Fq 'BIONIC_021_FEX_PTHREAD_LLE_PRELOAD' modern-core/src/core/linker.cpp
          echo BIONIC_021_FEX_GUEST_THREADS_AND_CALLBACKS_RESTORED

      - name: Audit modern kernel timezone and rebase remaining POSIX signals
        run: |
          set -euo pipefail
          python3 -m py_compile bionic/modern/port_android_compat.py
          python3 bionic/modern/port_android_compat.py --source modern-core
          grep -Fq 'localtime_r(&t, &tm_val)' modern-core/src/core/libraries/kernel/time.cpp
          grep -Fq 'posix_sigisemptyset' modern-core/src/core/libraries/kernel/threads/exception.cpp

      - name: Port Bionic host UUID provider without changing PS4 HLE
        run: |
          set -euo pipefail
          python3 -m py_compile bionic/compat/port_kernel_uuid_0211.py
          python3 bionic/compat/port_kernel_uuid_0211.py --source modern-core
          grep -Fq 'BIONIC_021_NATIVE_UUID' modern-core/src/core/libraries/kernel/kernel.cpp

      - name: Audit actual core 0.21.1 source versus Android/Bionic integration
        run: |
          set -euo pipefail
          python3 -m py_compile bionic/generic/port_generic.py bionic/modern/audit_modern_core.py
          python3 bionic/modern/audit_modern_core.py \
            --source modern-core \
            --legacy-overlay bionic/generic/port_generic.py \
            --json-out /tmp/modern-core-audit.json
          cat /tmp/modern-core-audit.json | python3 -m json.tool | head -180
          printf '\n### Native ARM64 core migration audit\n' >> "$GITHUB_STEP_SUMMARY"
          python3 bionic/modern/audit_modern_core.py \
            --source modern-core \
            --legacy-overlay bionic/generic/port_generic.py \
            --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Cross-compile actual Android Bionic JNI entry object (NDK r30)
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            ndk;30.0.14904198

      - name: Verify shadPS4 0.21.1 JNI bridge compiles for AArch64 Bionic
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/30.0.14904198"
          compiler="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++"
          mkdir -p /tmp/bachata-modern-obj
          "$compiler" -std=c++23 -O2 -fPIC -Wall -Wextra -Werror \
            -I modern-core/src -I bionic/generic \
            -c bionic/generic/android_native_core.cpp \
            -o /tmp/bachata-modern-obj/android_native_core.o
          readelf -h /tmp/bachata-modern-obj/android_native_core.o | grep -q AArch64
          "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            /tmp/bachata-modern-obj/android_native_core.o | \
            grep -Fq Java_com_bachatas4_android_runtime_process_NativeRuntimeBridge_run
          echo "BIONIC_021_JNI_AARCH64_OBJECT_BUILD_OK"

      - name: Checkout pinned Android FEX + dependency recipes
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-modern]')
        uses: actions/checkout@v4
        with:
          repository: erickmendes22/uncharted-android
          ref: 148656bc7ae1b8b482d95e33d49f0729421ff477
          path: port
          submodules: false
          persist-credentials: false

      - name: Prepare full modern Android build and host tools
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-modern]')
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm cmake ninja-build bison flex pkg-config \
            build-essential nasm git unzip curl binutils ccache glslang-tools
          mkdir -p out/bionic-modern
          python3 bionic/modern/port_android_deps.py --source modern-core
          python3 bionic/modern/port_host_shaders.py --source modern-core
          command -v glslangValidator
          glslangValidator --version | head -3
          grep -Fq 'BIONIC_021_HOST_SHADER_COMPILER' modern-core/src/video_core/host_shaders/CMakeLists.txt
          grep -Fq 'BIONIC_021_NDK_FFMPEG' modern-core/externals/CMakeLists.txt
          grep -Fq 'BIONIC_021_OPENAL_NO_LINUX_AUDIO' modern-core/externals/CMakeLists.txt

      - name: Check out pinned 0.21.1 submodules (skip macOS-only tree)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-modern]')
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/$MODERN_PORT_REPO/$MODERN_PORT_REF"
          curl -fLsS --retry 3 "$base/config/gitmodules" -o modern-core/.gitmodules
          while read -r module sha; do
            test -n "$module" || continue
            git -C modern-core update-index --add --cacheinfo "160000,$sha,$module"
          done < /tmp/shadps4-0211-modules.txt
          while read -r module; do
            test -n "$module" || continue
            if ! grep -Fq "path = $module" modern-core/.gitmodules; then
              git -C modern-core update-index --force-remove "$module"
            fi
          done < <(git -C modern-core ls-files -s | awk '$1=="160000" {print $4}')
          git -C modern-core submodule sync
          mapfile -t modules < <(awk '$1 !~ /^(externals\/mesa-kosmickrisp|externals\/bachata-xserver|externals\/vulkan-loader|externals\/ffmpeg-core|externals\/discord-rpc|externals\/ext-wepoll|externals\/epoll-shim|externals\/date)$/ {print $1}' /tmp/shadps4-0211-modules.txt)
          git -C modern-core submodule update --init --jobs 6 -- "${modules[@]}"
          test -s modern-core/externals/imgui/imgui.cpp
          git -C modern-core/externals/sirit submodule update --init --depth 1 --jobs 2
          test -s modern-core/externals/sirit/externals/SPIRV-Headers/CMakeLists.txt
          test -s modern-core/externals/sdl3/CMakeLists.txt
          echo BIONIC_021_SUBMODULES_PINNED

      - name: Restore Bionic 0.21.1 dependency and FEX build cache
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-modern]')
        uses: actions/cache/restore@v4
        with:
          path: |
            out/bionic-modern/deps
            out/bionic-modern/fex
            out/bionic-modern/fex-android
            out/bionic-modern/build
            out/bionic-modern/host-protoc-build
            .ccache
          key: bachata-bionic-0211-r30-${{ github.sha }}
          restore-keys: |
            bachata-bionic-0211-r30-

      - name: Compile protoc from SAME pinned protobuf source as the Android runtime
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-modern]')
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/out/bionic-modern"
          cmake -S bionic/modern/host-protoc -B "$root/host-protoc-build" -G Ninja \
            -DSHADPS4_SOURCE_ROOT="$GITHUB_WORKSPACE/modern-core" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build "$root/host-protoc-build" --target protoc -j3 \
            2>&1 | tee "$root/host-protoc.log"
          test -x "$root/host-protoc-build/protobuf/protoc"
          "$root/host-protoc-build/protobuf/protoc" --version
          grep -Fq '7.36.0' modern-core/externals/protobuf/CMakeLists.txt
          echo "BIONIC_021_PINNED_PROTOC_HOST_BUILT"

      - name: Compile Android FFmpeg and native FEXCore
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-modern]')
        run: |
          set -euo pipefail
          export NDK="$ANDROID_HOME/ndk/30.0.14904198"
          export DEPS="$GITHUB_WORKSPACE/out/bionic-modern/deps"
          export BACHATA_JOBS=3
          mkdir -p "$DEPS"
          sed -i 's/^J=$(nproc)$/J=3/' port/android/scripts/port-arm64/android_deps.sh
          bash port/android/scripts/port-arm64/android_deps.sh ffmpeg
          test -s "$DEPS/prefix/lib/libavcodec.so"
          FEX_REV=f2b679f6028ce1c38875233aecfcf5d3f8ebecec
          FEX_SRC="$GITHUB_WORKSPACE/out/bionic-modern/fex"
          FEX_BUILD="$GITHUB_WORKSPACE/out/bionic-modern/fex-android"
          if [[ ! -d "$FEX_SRC/.git" ]]; then
            git clone -q --filter=blob:none https://github.com/FEX-Emu/FEX.git "$FEX_SRC"
          fi
          git -C "$FEX_SRC" fetch -q --no-tags origin "$FEX_REV"
          git -C "$FEX_SRC" checkout -q "$FEX_REV"
          git -C "$FEX_SRC" submodule update -q --init --jobs 4 \
            External/fmt External/xxhash External/range-v3 External/unordered_dense \
            External/rpmalloc External/jemalloc_glibc External/vixl External/zydis \
            Source/Common/cpp-optparse
          git -C "$FEX_SRC" reset --hard "$FEX_REV"
          git -C "$FEX_SRC" clean -fd
          for patch in port/android/scripts/port-arm64/patches/fex-*.patch; do
            git -C "$FEX_SRC" apply --check "$GITHUB_WORKSPACE/$patch"
            git -C "$FEX_SRC" apply "$GITHUB_WORKSPACE/$patch"
          done
          SRC="$FEX_SRC" OUT="$FEX_BUILD" TUNE_CPU=cortex-a78 \
            bash port/android/scripts/port-arm64/build_fex_android.sh \
            2>&1 | tee out/bionic-modern/fex-build.log
          test -s "$FEX_BUILD/FEXCore/Source/libFEXCore.a"
          echo BIONIC_021_FEX_ANDROID_COMPILED

      - name: Configure and compile complete 0.21.1 Android native core
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-modern]')
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/out/bionic-modern"
          NDK="$ANDROID_HOME/ndk/30.0.14904198"
          # Font embedding is a HOST build tool. Android cannot run a
          # cross-compiled AArch64 generator on the Ubuntu runner.
          host_font="modern-core/externals/imgui/misc/fonts/binary_to_compressed_c.cpp"
          test -s "$host_font"
          c++ -std=c++17 -O2 "$host_font" -o "$root/imgui-font-host"
          test -x "$root/imgui-font-host"
          test -x "$root/host-protoc-build/protobuf/protoc"
          # Discard cached gencode made by mismatched protoc 35.1/36.0.
          # Ninja then regenerates headers and C++ with the pinned host tool.
          rm -f "$root/build/shadnet_proto_gen/shadnet.pb.h" \
                "$root/build/shadnet_proto_gen/shadnet.pb.cc"
          cmake -S modern-core -B "$root/build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=33 \
            -DANDROID_STL=c++_shared -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DENABLE_DISCORD_RPC=OFF -DENABLE_UPDATER=OFF -DENABLE_TESTS=OFF \
            -DENABLE_BACHATA_RUNTIME=ON -DENABLE_FEX_GUEST_CPU=ON \
            -DFEXCORE_GUEST_CPU_SOURCE_DIR="$root/fex" \
            -DFEXCORE_GUEST_CPU_BUILD_DIR="$root/fex-android" \
            -DIMGUI_FONT_EMBED_EXECUTABLE="$root/imgui-font-host" \
            -DWITH_PROTOC="$root/host-protoc-build/protobuf/protoc" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBACHATA_ANDROID_FFMPEG_PREFIX="$root/deps/prefix" \
            -DCMAKE_PREFIX_PATH="$root/deps/prefix" \
            2>&1 | tee "$root/configure.log"
          # Compile Android-specific interfaces before 2,000 other objects.
          # Catch modern header drift and proto mismatches immediately.
          mapfile -t object_targets < <(ninja -C "$root/build" -t targets all |
            awk '/^CMakeFiles\/shadps4.dir\// {
              if ($1 ~ /android_window.cpp.o:$/ ||
                  $1 ~ /threads\/pthread.cpp.o:$/ ||
                   $1 ~ /core\/linker.cpp.o:$/ ||
                  $1 ~ /shadnet.pb.cc.o:$/ ||
                  $1 ~ /core\/file_sys\/fs.cpp.o:$/ ||
                  $1 ~ /core\/file_sys\/saf_fs_backend.cpp.o:$/ ||
                  $1 ~ /core\/libraries\/libs.cpp.o:$/) {
                sub(/:$/, "", $1); print $1
              }
            }')
          for expected in android_window.cpp.o pthread.cpp.o linker.cpp.o shadnet.pb.cc.o fs.cpp.o saf_fs_backend.cpp.o libs.cpp.o; do
            matched=0
            for target in "${object_targets[@]}"; do
              [[ "$target" == *"$expected" ]] && matched=1
            done
            if [[ "$matched" != 1 ]]; then
              echo "::error::Missing 0.21.1 early compile target $expected"
              exit 3
            fi
          done
          ninja -C "$root/build" -j3 "${object_targets[@]}"
          echo "BIONIC_021_CRITICAL_INTERFACES_AND_SAF_VFS_COMPILED"
          cmake --build "$root/build" --target shadps4 -j3 -- -k 8 \
            2>&1 | tee "$root/compiler.log"
          core="$root/build/libbachata_bionic_core.so"
          test -s "$core"
          readelf -h "$core" | grep -q AArch64
          readelf -d "$core" | grep -Fq 'Shared library: [libc.so]'
          ! readelf -d "$core" | grep -Eq 'libc.so.6|ld-linux-aarch64'
          readelf -Ws "$core" | grep -Fq Java_com_bachatas4_android_runtime_process_NativeRuntimeBridge_run
          echo BIONIC_021_REAL_CORE_COMPILED

      - name: Upload native shadPS4 0.21.1 Bionic library and media deps
        if: success() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-modern]'))
        uses: actions/upload-artifact@v4
        with:
          name: bachata-shadps4-0211-real-bionic-core
          path: |
            out/bionic-modern/build/libbachata_bionic_core.so
            out/bionic-modern/deps/prefix/lib/libav*.so*
            out/bionic-modern/deps/prefix/lib/libsw*.so*
          if-no-files-found: error
          retention-days: 14

      - name: Upload modern Bionic build errors
        if: failure() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-modern]'))
        uses: actions/upload-artifact@v4
        with:
          name: bachata-shadps4-0211-build-diagnostics
          path: |
            out/bionic-modern/configure.log
            out/bionic-modern/compiler.log
            out/bionic-modern/fex-build.log
            out/bionic-modern/host-protoc.log
            out/bionic-modern/deps/build/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Cache compiled NDK dependencies even if modern core compile fails
        if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-modern]'))
        uses: actions/cache/save@v4
        with:
          path: |
            out/bionic-modern/deps
            out/bionic-modern/fex
            out/bionic-modern/fex-android
            out/bionic-modern/build
            out/bionic-modern/host-protoc-build
            .ccache
          key: bachata-bionic-0211-r30-${{ github.sha }}

      - name: Upload compact source compatibility report (no APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bionic-0211-source-migration-report
          path: /tmp/modern-core-audit.json
          if-no-files-found: ignore

# Full modern build runs on explicit [build-modern] commit, never recycles old core.
