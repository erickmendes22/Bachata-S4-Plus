name: Order control source-build probe

on:
  push:
    branches:
      - order-control-sdl-prexim
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-order-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout control repo
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout exact onRps4 runtime base
        uses: actions/checkout@v4
        with:
          repository: dev-Ali2008/onRps4-runtime
          ref: 5b50e35c38ad09088761c1b146168107dcdec1e7
          fetch-depth: 0
          submodules: false
          path: source

      - name: Hydrate nested shadPS4 submodules
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git config --global --add safe.directory "*"

          hydrate_repo() {
            local root="$1"
            local depth="$2"
            (( depth > 5 )) && return 0
            [[ -f "$root/.gitmodules" ]] || return 0

            while read -r key path; do
              local name="${key#submodule.}"
              name="${name%.path}"
              local url branch target

              url="$(git -C "$root" config -f .gitmodules --get "submodule.$name.url" || true)"
              branch="$(git -C "$root" config -f .gitmodules --get "submodule.$name.branch" || true)"
              target="$root/$path"
              [[ -n "$url" ]] || continue

              git -C "$root" -c submodule.recurse=false submodule sync -- "$path" || true
              if ! git -C "$root" -c submodule.recurse=false submodule update --init --depth 1 -- "$path"; then
                rm -rf "$target"
                if [[ -n "$branch" ]]; then
                  git clone --depth 1 --branch "$branch" "$url" "$target" || git clone --depth 1 "$url" "$target"
                else
                  git clone --depth 1 "$url" "$target"
                fi
              fi

              [[ -d "$target" ]] && hydrate_repo "$target" "$((depth + 1))" || true
            done < <(
              git -C "$root" config -f .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null || true
            )
          }

          hydrate_repo "runtime/sources/shadps4" 0

      - name: Pin SDL3 before XIM rewrite
        shell: bash
        working-directory: source/runtime/sources/shadps4/externals/sdl3
        run: |
          set -euo pipefail
          git fetch --depth 1 origin 1f3b40797d9cbd03fe50342069e3449a779723dc
          git checkout --detach 1f3b40797d9cbd03fe50342069e3449a779723dc
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/sdl3.commit"

      - name: Apply external ImGui compatibility shim
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          FILE="runtime/sources/shadps4/externals/ImGuiFileDialog/ImGuiFileDialog.cpp"
          grep -q 'NextWindowData.ChildFlagsSet' "$FILE"
          sed -i 's/NextWindowData\.ChildFlagsSet/NextWindowData.ChildFlags/g' "$FILE"
          grep -n 'NextWindowData.ChildFlags.*NavFlattened' "$FILE"

      - name: Capture control source state
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          printf 'onRps4-runtime=%s\n' "$(git rev-parse HEAD)" | tee "$GITHUB_WORKSPACE/control-source.txt"
          printf 'SDL3=%s\n' "$(git -C runtime/sources/shadps4/externals/sdl3 rev-parse HEAD)" | tee -a "$GITHUB_WORKSPACE/control-source.txt"
          git status --short | tee "$GITHUB_WORKSPACE/control-git-status.txt"

      - name: Install and build x86-64 shadPS4
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE/source:/workspace" \
            -w /workspace \
            -e BACHATA_INSIDE_DEBIAN_CONTAINER=1 \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates curl
              git config --global --add safe.directory "*"
              bash runtime/scripts/install-debian-runtime-deps.sh
              bash runtime/scripts/build-shadps4-x86_64.sh
            '

      - name: Collect x86-64 core
        shell: bash
        run: |
          set -euo pipefail
          CORE="$(find source/runtime/build -type f -name shadps4 -size +10M | head -n1)"
          test -n "$CORE"
          file "$CORE" | tee "$GITHUB_WORKSPACE/core.file"
          readelf -h "$CORE" | tee "$GITHUB_WORKSPACE/core.elf"
          file "$CORE" | grep -E 'x86-64|x86_64'
          cp "$CORE" "$GITHUB_WORKSPACE/shadps4-order-control-x86_64"
          sha256sum "$GITHUB_WORKSPACE/shadps4-order-control-x86_64" | tee "$GITHUB_WORKSPACE/shadps4-order-control-x86_64.sha256"

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: order-control-source-build-probe
          path: |
            control-source.txt
            control-git-status.txt
            sdl3.commit
            core.file
            core.elf
            shadps4-order-control-x86_64
            shadps4-order-control-x86_64.sha256
          if-no-files-found: warn
          retention-days: 7
