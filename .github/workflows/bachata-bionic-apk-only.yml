name: Bachata S4+ Bionic APK ONLY - repackage existing ARM64 core
on:
  # Explicitly controlled: do not publish experimental APKs just because
  # a JNI/DEX change landed; the permanent P36 secrets must be configured.
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed GitHub Actions run with compiled Bionic core
        required: false
        type: string
        default: '44751437665'
permissions:
  contents: read
  actions: read
jobs:
  assemble-bionic-apk:
    name: Assemble and sign Bachata S4+ 0.2.7 Bionic TEST APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BACHATA_P36_PRIVATE_KEY: ${{ secrets.BACHATA_P36_PRIVATE_KEY }}
      BACHATA_P36_CERT: ${{ secrets.BACHATA_P36_CERT }}
    steps:
      - name: Checkout all packaging and integration source from GitHub
        uses: actions/checkout@v4

      - name: Require permanent Bachata S4+ P36 signing secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BACHATA_P36_PRIVATE_KEY" || -z "$BACHATA_P36_CERT" ]]; then
            echo '::error::P36 signing key or certificate is not configured. Add GitHub Actions repository secrets BACHATA_P36_PRIVATE_KEY and BACHATA_P36_CERT, then rerun APK-only. Temporary signing has been disabled.'
            exit 3
          fi

      - name: Retrieve freshly compiled Bionic core from THIS workflow run
        uses: actions/download-artifact@v4
        with:
          name: Bachata-S4Plus-FULL-general-purpose-Bionic-core
          path: out/bionic/stage
          run-id: ${{ github.event.inputs.source_run_id || '44751437665' }}
          github-token: ${{ github.token }}

      - name: Android build tools and ELF patching
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            build-tools;36.0.0
            ndk;30.0.14904198

      - name: Install ELF tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends patchelf binutils
          python3 -m py_compile bionic/apk/assemble_apk.py bionic/apk/patch_frontend.py
          bash -n bionic/apk/normalize_elf.sh

      - name: Fetch exact Bachata S4+ 0.2.7 Android frontend from Release
        run: |
          set -euo pipefail
          mkdir -p out/apk
          curl -fL --retry 4 --retry-delay 3 \
            'https://github.com/erickmendes22/Bachata-S4-Plus/releases/download/0.2.7/Bachata-S4-Plus-v0.2.7.apk' \
            -o out/apk/Bachata-S4-Plus-v0.2.7-base.apk
          echo '35c6fad39430e54aba561877953323e03b322a589a44442931317450e0b952d8  out/apk/Bachata-S4-Plus-v0.2.7-base.apk' | sha256sum -c -


      - name: Patch 0.2.7 frontend to register real Bionic core JNI (DEX only)
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar' \
            -o out/apk/apktool-2.12.1.jar
          java -Xmx5G -jar out/apk/apktool-2.12.1.jar d -f -r \
            out/apk/Bachata-S4-Plus-v0.2.7-base.apk -o out/apk/decoded > out/apk/apktool-decompile.log 2>&1
          python3 bionic/apk/patch_frontend.py out/apk/decoded
          java -Xmx5G -jar out/apk/apktool-2.12.1.jar b out/apk/decoded \
            -o out/apk/recompiled-smali.apk > out/apk/apktool-rebuild.log 2>&1
          unzip -p out/apk/recompiled-smali.apk classes8.dex > out/apk/classes8-bionic.dex
          test -s out/apk/classes8-bionic.dex
          echo "NativeRuntimeBridge Bionic core JNI loader DEX prepared (rest of frontend preserved)"

      - name: Compile ONLY lightweight Android JNI handoff (no shadPS4/FEX rebuild)
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/30.0.14904198"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++"
          "$CXX" -std=c++17 -O2 -Wall -Wextra -Werror -fPIC -shared \
            bionic/jni/bachata_native_bridge.cpp \
            -o out/bionic/stage/lib/arm64-v8a/libbachata_native_runtime.so \
            -landroid -llog -ldl
          # The Java SDL.setupJNI() methods are exported from the monolithic
          # libbachata_bionic_core.so, *not* from libSDL3.so. Check only global
          # defined DYNAMIC symbols, which Android's dlsym can actually resolve.
          CORE=out/bionic/stage/lib/arm64-v8a/libbachata_bionic_core.so
          for symbol in \
            JNI_OnLoad \
            Java_org_libsdl_app_SDLActivity_nativeSetupJNI \
            Java_org_libsdl_app_SDLAudioManager_nativeSetupJNI \
            Java_org_libsdl_app_SDLControllerManager_nativeSetupJNI \
            Java_com_bachatas4_android_runtime_process_NativeRuntimeBridge_run \
            Java_com_bachatas4_android_runtime_process_NativeRuntimeBridge_stop; do
            if ! readelf --dyn-syms --wide "$CORE" |
              awk -v target="$symbol" '$4 == "FUNC" && $5 == "GLOBAL" && $7 != "UND" && $8 == target { found=1 } END { exit !found }'; then
              echo "::error::Bionic core lacks globally exported JNI symbol $symbol"; exit 2
            fi
          done
          echo "JNI adapter rebuilt; core SDL + Bachata ABI exports validated for Android"

      - name: Normalize SONAMEs and audit JNI exports
        run: |
          set -euo pipefail
          bash bionic/apk/normalize_elf.sh out/bionic/stage/lib/arm64-v8a

      - name: Integrate newly compiled native runtime into 0.2.7 APK
        run: |
          set -euo pipefail
          python3 bionic/apk/assemble_apk.py \
            --base out/apk/Bachata-S4-Plus-v0.2.7-base.apk \
            --stage out/bionic/stage \
            --output out/apk/Bachata-S4Plus-Bionic-unsigned.apk \
            --patched-classes8 out/apk/classes8-bionic.dex \
            --revision "$GITHUB_SHA"

      - name: Align and sign testable Android APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -f -P 16 4 \
            out/apk/Bachata-S4Plus-Bionic-unsigned.apk \
            out/apk/Bachata-S4Plus-Bionic-aligned.apk
          KEY=out/apk/bachata-p36-private.pem
          CERT=out/apk/bachata-p36-cert.pem
          trap 'rm -f "$KEY" "$CERT"' EXIT
          # GitHub Secrets provide the ORIGINAL PEM key and X.509 certificate.
          # Never commit them or generate a new certificate during CI.
          umask 077
          printf '%s\n' "$BACHATA_P36_PRIVATE_KEY" > "$KEY"
          printf '%s\n' "$BACHATA_P36_CERT" > "$CERT"
          EXPECTED_P36_SHA256=d04ef2a865f8ed5ab8f98321be93ed2881eaa64f844fbaf480e18a8336620a72
          actual_cert_sha256="$(openssl x509 -in "$CERT" -outform DER | sha256sum | cut -d' ' -f1)"
          if [[ "$actual_cert_sha256" != "$EXPECTED_P36_SHA256" ]]; then
            echo "::error::P36 certificate mismatch: $actual_cert_sha256"
            exit 4
          fi
          key_public="$(openssl pkey -in "$KEY" -pubout -outform DER | sha256sum | cut -d' ' -f1)"
          cert_public="$(openssl x509 -in "$CERT" -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
          if [[ "$key_public" != "$cert_public" ]]; then
            echo "::error::P36 private key does not match certificate"
            exit 4
          fi
          # Ensure that test builds can update the ORIGINAL 0.2.7 app
          # without wiping existing game saves and settings.
          "$BT/apksigner" verify --verbose --print-certs \
            out/apk/Bachata-S4-Plus-v0.2.7-base.apk > out/apk/base-signer-verification.txt
          base_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' out/apk/base-signer-verification.txt | head -n1)"
          if [[ "$base_sha256" != "$EXPECTED_P36_SHA256" ]]; then
            echo "::error::Base 0.2.7 is signed by $base_sha256, not P36. Refusing a non-updatable build."
            exit 4
          fi
          "$BT/apksigner" sign \
            --key "$KEY" --cert "$CERT" \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out out/apk/Bachata-S4Plus-0.2.7-Bionic-TEST.apk \
            out/apk/Bachata-S4Plus-Bionic-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs \
            out/apk/Bachata-S4Plus-0.2.7-Bionic-TEST.apk \
            | tee out/apk/apksigner-verification.txt
          signed_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' out/apk/apksigner-verification.txt | head -n1)"
          if [[ "$signed_sha256" != "$EXPECTED_P36_SHA256" ]]; then
            echo "::error::Output APK signer is not original P36"
            exit 5
          fi
          printf 'P36 original certificate SHA256: %s\n' "$EXPECTED_P36_SHA256" > out/apk/SIGNING-MODE.txt
          sha256sum out/apk/Bachata-S4Plus-0.2.7-Bionic-TEST.apk > out/apk/SHA256SUMS
          test -s out/apk/Bachata-S4Plus-0.2.7-Bionic-TEST.apk
          echo 'BIONIC_TEST_APK_P36_SIGNED_AND_VERIFIED'

      - name: Upload INSTALLABLE TEST APK (not another native-library ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Bachata-S4Plus-0.2.7-Bionic-TEST-APK
          path: |
            out/apk/Bachata-S4Plus-0.2.7-Bionic-TEST.apk
            out/apk/SHA256SUMS
            out/apk/SIGNING-MODE.txt
            out/apk/apksigner-verification.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
